      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b1020; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: "Be Vietnam Pro", sans-serif; }
      .bg { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; }
      .scrim { position: absolute; left: 0; top: 0; width: 1280px; height: 330px; background: linear-gradient(180deg, rgba(11,16,32,0.92) 0%, rgba(11,16,32,0.72) 55%, rgba(11,16,32,0) 100%); }
      .scrim2 { position: absolute; left: 0; bottom: 0; width: 520px; height: 300px; background: radial-gradient(ellipse at 0% 100%, rgba(11,16,32,0.85) 0%, rgba(11,16,32,0) 70%); }
      .t { position: absolute; top: 8px; font-weight: 800; font-size: 214px; line-height: 1; letter-spacing: -0.02em; }
      .oop { left: 44px; color: #F59E0B; text-shadow: 0 8px 0 #7a4a00, 0 0 40px rgba(245,158,11,0.55), 0 0 4px #000; }
      .pop { right: 44px; color: #10B981; text-shadow: 0 8px 0 #065f46, 0 0 40px rgba(16,185,129,0.55), 0 0 4px #000; }
      .vs { position: absolute; left: 585px; top: 70px; width: 110px; height: 110px; border-radius: 50%; background: #E2E8F0; color: #0B1020; font-weight: 800; font-size: 56px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #64748b, 0 0 30px rgba(226,232,240,0.5); }
      .tag { position: absolute; left: 40px; top: 470px; padding: 10px 28px 12px; border-radius: 18px; background: rgba(11,16,32,0.88); border: 4px solid #F59E0B; color: #E2E8F0; font-weight: 800; font-size: 54px; line-height: 1.1; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
      .tag b { color: #F59E0B; }
      .logo { position: absolute; left: 36px; bottom: 30px; width: 124px; height: 124px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }

    <div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1280" data-height="720">

      <div class="scrim"></div>
      <div class="scrim2"></div>
      <div class="t oop">OOP</div>
      <div class="t pop">POP</div>
      <div class="vs">VS</div>

      <img class="logo" src="assets/images/logo-tron.png" alt="" />
    </div>
