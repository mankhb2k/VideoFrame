<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>vk.ide demo</title>
<style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../../brand/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC; }
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../../brand/fonts/jetbrains-mono-vietnamese-400-normal.woff2') format('woff2'); unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../../brand/fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2'); unicode-range: U+0000-00FF; }
:root { --nen:#F8F7F4; --cam:#F26A21; --ma-dau:#1E1E22; --ma-chu-thich:#9CA3AF; --cham-do:#FF5F57; --cham-vang:#FEBC2E; --cham-xanh:#28C840; --vien-ma:1px solid #000; --bong-ma:0 14px 36px rgba(17,17,19,0.28); --ban-kinh:14px; }
body { margin:0; background:#F8F7F4; font-family: sans-serif; }
#root { position:relative; width:1920px; height:1080px; transform-origin:0 0; }
#thanh { position:fixed; left:12px; bottom:12px; z-index:9; background:#fff; padding:8px 12px; border:1px solid #ccc; border-radius:10px; font:14px sans-serif; }
#thanh input { width:480px; vertical-align:middle; }
</style>
<link rel="stylesheet" href="../core/vk.css"><link rel="stylesheet" href="vk-ide.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head><body>
<div id="root"></div>
<div id="thanh">Kéo để xem: <input id="t" type="range" min="0" max="26" step="0.05" value="0"> <b id="tv">0.0</b>s</div>
<script src="../core/vk.js"></script><script src="vk-ide.js"></script>
<script>
const tl = gsap.timeline({ paused: true }), root = document.getElementById("root");
const ide = vk.ide(root, { x: 160, y: 60, width: 1600, terminal: 230, file: "so_tay.py", code: [
  'ten_cua_hang = "Tạp hoá Ông Sơn"   # chữ', "von = 20000000                     # số", "dang_mo_cua = True                 # đúng hoặc sai", "",
  'print("Tên tiệm:", ten_cua_hang)', 'print("Vốn hiện có:", von, "VNĐ")', "", "gia_gao_tam = 22000", "gia_gao_st25 = 30000", "gia_gao_thuong = 15000"] });   // 10 dòng: tự chọn mức "small"
let t = ide.type(tl, { from: 1, to: 3, t: 0.5, cps: 30 });
ide.highlight(tl, 2, t + 0.5, t + 2.0);
t = ide.type(tl, { from: 5, to: 6, t: t + 2.2, cps: 30 });
t = ide.run(tl, t + 0.4, { command: "python so_tay.py", output: ["Tên tiệm: Tạp hoá Ông Sơn", "Vốn hiện có: 20000000 VNĐ"] });
ide.show(tl, 8, 10, t + 0.6);
const k = Math.min(1, innerWidth / 1920); root.style.transform = `scale(${k})`;
document.getElementById("t").oninput = (ev) => { tl.time(+ev.target.value, false); document.getElementById("tv").textContent = (+ev.target.value).toFixed(1); };
const t0 = +(new URLSearchParams(location.search).get("t") || 0); document.getElementById("t").value = t0; document.getElementById("tv").textContent = t0.toFixed(1); tl.time(t0);
</script></body></html>
