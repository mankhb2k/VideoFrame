/* Hàm dùng chung cho mọi cảnh (build_canh.py chèn vào chỗ đánh dấu VK_JS trong thẻ <script>, TRƯỚC khi tạo `tl`).
   Mọi hàm nhận timeline `tl` và đích (phần tử hoặc selector), chỉ tạo tween xác định (không Math.random, không Date.now),
   dùng fromTo với trạng thái đầu rõ ràng nên seek theo hai chiều đều đúng. Thời điểm `t` tính bằng giây trong cảnh hiện tại. */
const vk = (() => {
  const GACH = [
    { ten: "BIẾN", lop: "bien" }, { ten: "HÀM", lop: "ham" }, { ten: "DATABASE", lop: "db" },
    { ten: "IF / ELSE", lop: "re" }, { ten: "VÒNG LẶP", lop: "lap" },
  ];
  const dinhDang = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const q = (x) => (typeof x === "string" ? document.querySelector(x) : x);

  /* hiện dần: mờ -> rõ, trượt từ dưới lên `dy` px (mặc định 28) */
  function vao(tl, el, t, o = {}) {
    tl.fromTo(el, { opacity: 0, y: (o.dy ?? 28) + (o.y ?? 0), x: o.x ?? 0, scale: o.scale0 ?? 1 },
      { opacity: 1, y: o.y ?? 0, x: o.x ?? 0, scale: 1, duration: o.dur ?? 0.55, ease: o.ease ?? "power3.out" }, t);
  }
  /* biến mất: mờ dần (và thu nhỏ nhẹ nếu cho `scale1`) */
  function ra(tl, el, t, o = {}) {
    tl.to(el, { opacity: o.opacity ?? 0, scale: o.scale1 ?? 1, duration: o.dur ?? 0.4, ease: "power2.in" }, t);
  }
  /* bật lên có nảy (cho chữ nhấn, viên gạch, dấu hỏi) */
  function pop(tl, el, t, o = {}) {
    tl.fromTo(el, { opacity: 0, scale: o.scale0 ?? 0.5 }, { opacity: 1, scale: o.scale1 ?? 1, duration: o.dur ?? 0.5, ease: "back.out(1.9)" }, t);
  }
  /* nảy một nhịp khi vật chạm đích (scale 1 -> 1.08 -> 1) */
  function nay(tl, el, t, o = {}) {
    const m = o.m ?? 1.08;
    tl.to(el, { scale: m, duration: 0.12, ease: "power2.out" }, t).to(el, { scale: 1, duration: 0.28, ease: "back.out(2.4)" }, t + 0.12);
  }
  /* bay theo cung từ (x0,y0) tới (x1,y1) trong `dur` giây; `cao` là độ vồng (âm = vồng lên). Phần tử nên đặt left:0; top:0 (lớp .vk-abs / .vk-nv / .vk-the) */
  function cung(tl, el, o) {
    const dur = o.dur ?? 0.9, cao = o.cao ?? -140, ymid = (o.y0 + o.y1) / 2 + cao;
    tl.fromTo(el, { x: o.x0, y: o.y0, rotation: o.r0 ?? 0, scale: o.s0 ?? 1, opacity: o.hien0 === false ? 0 : 1 },

  /* tô sáng một dòng code (hoặc phần tử bất kỳ) từ tOn tới tOff, bằng màu nền mờ */

     `roi` là viên rơi: một số (1..5) rơi lúc `t`, hoặc danh sách [{i: 4, t: 12.3}, {i: 5, t: 15}]. Trả về phần tử kệ. */
  function keGach(tl, parent, o = {}) {

  /* viên gạch lớn: rơi từ trên xuống giữa khung (cx, cy) lúc `t` với độ phóng `scale`, rồi (nếu có `tBay`) bay theo cung xuống đúng ô `i` (1..5) của kệ gạch
     và thu về cỡ 1 trong `durBay` giây. Trả về phần tử. Kệ gạch tạo riêng bằng vk.keGach (ô trống) cùng cảnh. */
  function gachLon(tl, parent, o) {

    q(parent).appendChild(g);
    const x0 = cx - 72, y0 = cy - 42, x1 = 96 + (i - 1) * 154, y1 = 48;
    tl.fromTo(g, { x: x0, y: y0 - 700, scale: sc, opacity: 0, rotation: -5 }, { y: y0, opacity: 1, rotation: 0, duration: 0.8, ease: "bounce.out" }, o.t);
    if (o.tBay != null) {
      const d = o.durBay ?? 1.0, ymid = (y0 + y1) / 2 - 120;
      tl.to(g, { x: x1, scale: 1, duration: d, ease: "power2.inOut" }, o.tBay);

  /* đặt ảnh nhân vật/đạo cụ vuông `size` px: tâm ngang `cx`, ĐÁY ẢNH tại `base` (chân nhân vật cách đáy ảnh khoảng 4%) */

    img.className = "vk-nv"; img.src = o.src; img.alt = "";

/* Co giãn thời gian của cả đoạn khi giọng đọc đổi: build_canh.py thay `gsap.timeline(...)` bằng `vkWarp(gsap.timeline(...), PTS)` nếu có file <id>.warp.json.
   PTS = [[giây cũ, giây mới], ...] tăng dần; mọi VỊ TRÍ bắt đầu (đối số thời điểm của to, from, fromTo, set, call, add, addLabel) đi qua đường gấp khúc này.
   Thời lượng từng tween giữ nguyên; ngoài điểm cuối thì dịch song song. Không có PTS thì giữ nguyên timeline. */
function vkWarp(tl, pts) {
  if (!pts || pts.length < 2) return tl;
  const f = (t) => {
    if (t <= pts[0][0]) return pts[0][1] + (t - pts[0][0]);
    for (let i = 1; i < pts.length; i++) {
      if (t <= pts[i][0]) {
        const [a, b] = pts[i - 1], [c, d] = pts[i];
        return b + ((t - a) / (c - a)) * (d - b);
      }
    }
    const e = pts[pts.length - 1];
    return e[1] + (t - e[0]);
  };
  const vitri = { to: 2, from: 2, fromTo: 3, set: 2, call: 2, add: 1, addLabel: 1 };
  Object.keys(vitri).forEach((m) => {
    const goc = tl[m].bind(tl), i = vitri[m];
    tl[m] = (...a) => {
      if (a.length > i && typeof a[i] === "number") a[i] = f(a[i]);
      return goc(...a);
    };
  });
  return tl;
}

/* Cửa sổ soạn code kiểu VS Code + terminal, dùng chung mọi video (build_canh.py nối vào cùng vk.js). Mọi thứ là hàm thuần của tiến độ timeline: seek hai chiều đúng.

   const ide = vk.ide(root, { x: 120, y: 160, w: 1100, h: 640, file: "so_tay.py", code: ["ten = \"Sơn\"", "von = 20000000"], term: 190, cỡ: 28 });
   ide.viet(tl, { tu: 1, den: 2, t: 3.0, cps: 26 });      // gõ dần dòng 1 đến 2 (ký tự mỗi giây); trả về giây kết thúc
   ide.hien(tl, 1, 3, t);                                  // hiện cả dòng 1..3 tức thì
   ide.sangDong(tl, 2, tOn, tOff, "rgba(250,204,21,0.2)"); // tô sáng một dòng
   ide.chay(tl, t, { lenh: "python so_tay.py", dauRa: ["Tên tiệm: Tạp hoá Ông Sơn", ...], xoa: true }); // terminal: gõ lệnh rồi in từng dòng kết quả
   ide.dong(n)                                              // phần tử dòng (để tween thêm)
   Màu cú pháp: tự nhận Python (từ khoá, chuỗi, số, chú thích, hàm, hằng True/False/None); tuỳ chọn lang: "text" để không tô màu. */
(() => {
  const TU_KHOA = new Set(["def", "return", "if", "elif", "else", "for", "while", "in", "not", "and", "or", "import", "from", "as", "pass", "break", "continue", "class", "try", "except", "with", "lambda"]);
  const HAM_SAN = new Set(["print", "len", "range", "input", "int", "str", "float", "list", "dict", "sum", "max", "min", "round", "type", "append"]);
  const HANG = new Set(["True", "False", "None"]);
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function tach(dong, lang) {
    if (lang === "text") return [{ c: "", s: dong }];
    const re = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d[\d_]*(?:\.\d+)?\b)|([A-Za-z_À-ỹ][\wÀ-ỹ]*)|(\s+)|(.)/g;
    const ds = [];
    let m;
    while ((m = re.exec(dong)) !== null) {
      if (m[1]) ds.push({ c: "t-cmt", s: m[1] });
      else if (m[2]) ds.push({ c: "t-str", s: m[2] });
      else if (m[3]) ds.push({ c: "t-num", s: m[3] });
      else if (m[4]) {
        const w = m[4], sau = dong.slice(m.index + w.length).trimStart()[0];
        const c = TU_KHOA.has(w) ? (["def", "class", "import", "from", "as", "lambda"].includes(w) ? "t-ctrl" : "t-kw")
          : HANG.has(w) ? "t-const" : (HAM_SAN.has(w) || sau === "(") ? "t-fn" : "t-var";
        ds.push({ c, s: w });
      } else ds.push({ c: "", s: m[0] });
    }
    return ds;
  }

  function htmlDong(ds, n) {
    let con = n, out = "";
    for (const d of ds) {
      if (con <= 0) break;
      const cat = d.s.slice(0, con);
      out += d.c ? `<span class="${d.c}">${esc(cat)}</span>` : esc(cat);
      con -= d.s.length;
    }
    return out;
  }

  function ide(parent, o) {
    const cỡ = o.cỡ ?? o.co ?? 26, lh = Math.round(cỡ * 1.6), lang = o.lang ?? "python";
    const lines = Array.isArray(o.code) ? o.code : String(o.code).split("\n");
    const termH = o.term === undefined ? 0 : o.term, stt = o.stt === false ? 0 : 30, dau = 44, tabs = 40;
    const root = document.createElement("div");
    root.className = "ide"; if (o.id) root.id = o.id;
    root.style.cssText = `left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;font-size:${cỡ}px;`;
    root.innerHTML = `<div class="ide-dau"><i></i><i></i><i></i><span>${esc(o.tieuDe ?? "Visual Studio Code")}</span></div>
      <div class="ide-tabs"><div class="ide-tab on"><b>${esc(o.dau ?? "PY")}</b>${esc(o.file ?? "main.py")}</div></div>`;
    const bodyTop = dau + tabs, bodyH = o.h - bodyTop - termH - stt;
    const body = document.createElement("div");
    body.className = "ide-body"; body.style.cssText = `top:${bodyTop}px;height:${bodyH}px;padding-top:14px;`;
    const so = document.createElement("div");
    so.className = "ide-gutter"; so.style.cssText = `width:${String(lines.length).length * cỡ * 0.62 + 34}px;font-size:${cỡ}px;line-height:${lh}px;`;
    so.innerHTML = lines.map((_, i) => `<div style="height:${lh}px">${i + 1}</div>`).join("");
    const code = document.createElement("div");
    code.className = "ide-code"; code.style.cssText = `font-size:${cỡ}px;line-height:${lh}px;`;
    const tok = lines.map((l) => tach(l, lang));
    const dem = lines.map((l) => l.length);
    const rows = lines.map(() => {
      const r = document.createElement("div"); r.className = "ide-row"; r.style.height = lh + "px"; code.appendChild(r); return r;
    });
    body.appendChild(so); body.appendChild(code); root.appendChild(body);
    let term = null, termThan = null;
    if (termH > 0) {
      term = document.createElement("div");
      term.className = "ide-term"; term.style.cssText = `top:${o.h - termH - stt}px;height:${termH}px;`;
      term.innerHTML = `<div class="ide-term-dau"><span>PROBLEMS</span><span>OUTPUT</span><b>TERMINAL</b></div><div class="ide-term-than"></div>`;
      termThan = term.querySelector(".ide-term-than");
      root.appendChild(term);
    }
    if (stt) {
      const s = document.createElement("div");
      s.className = "ide-stt"; s.innerHTML = `<span>⎇ main</span><span>${esc(o.ngonNgu ?? "Python")} · UTF-8</span>`;
      root.appendChild(s);
    }
    (typeof parent === "string" ? document.querySelector(parent) : parent).appendChild(root);

    const ve = (i, n, caret) => {
      rows[i].innerHTML = htmlDong(tok[i], n) + (caret && n > 0 && n < dem[i] ? '<span class="ide-caret">&nbsp;</span>' : "");
    };
    const api = { root, dong: (n) => rows[n - 1] };
    api.viet = (tl, a) => {
      const cps = a.cps ?? 26, nghi = a.nghi ?? 0.18;
      let t = a.t;
      for (let i = a.tu - 1; i <= a.den - 1; i++) {
        const p = { n: 0 }, d = Math.max(0.05, dem[i] / cps);
        ve(i, 0, false);
        tl.to(p, { n: dem[i], duration: d, ease: "none", onUpdate() { ve(i, Math.round(p.n), true); } }, t);
        t += d + (dem[i] ? nghi : 0.05);
      }
      return t;
    };
    api.hien = (tl, tu, den, t) => {
      for (let i = tu - 1; i <= den - 1; i++) {
        const p = { n: 0 };
        ve(i, 0, false);
        tl.to(p, { n: dem[i], duration: 0.001, ease: "none", onUpdate() { ve(i, Math.round(p.n), false); } }, t);
      }
    };
    api.sangDong = (tl, n, tOn, tOff, mau = "rgba(250,204,21,0.2)") => {
      tl.fromTo(rows[n - 1], { backgroundColor: "rgba(0,0,0,0)", borderLeftColor: "rgba(0,0,0,0)" }, { backgroundColor: mau, borderLeftColor: "#F26A21", duration: 0.25, ease: "power2.out" }, tOn);
      if (tOff != null) tl.to(rows[n - 1], { backgroundColor: "rgba(0,0,0,0)", borderLeftColor: "rgba(0,0,0,0)", duration: 0.3, ease: "power2.in" }, tOff);
    };
    let trangTruoc = null;
    api.chay = (tl, t, a) => {
      if (!termThan) throw new Error("vk.ide: cần tuỳ chọn term (chiều cao terminal)");
      const cps = a.cps ?? 22, gian = a.gian ?? 0.3, tr = document.createElement("div");
      tr.className = "ide-trang"; tr.style.fontSize = (a.co ?? Math.round(cỡ * 0.78)) + "px"; tr.style.lineHeight = "1.55";
      const dong0 = document.createElement("div"); dong0.className = "ide-dong-term";
      tr.appendChild(dong0);
      const outs = (a.dauRa || []).map((s) => {
        const d = document.createElement("div"); d.className = "ide-dong-term"; d.textContent = s; d.style.opacity = "0"; tr.appendChild(d); return d;
      });
      termThan.appendChild(tr);
      const lenh = a.lenh ?? "python main.py", dauNhac = `<span class="dau">$ </span>`;
      dong0.innerHTML = dauNhac;
      gsap.set(tr, { opacity: 0 });
      if (a.xoa !== false && trangTruoc) tl.to(trangTruoc, { opacity: 0, duration: 0.2 }, t);
      tl.to(tr, { opacity: 1, duration: 0.05 }, t);
      const p = { n: 0 }, d = Math.max(0.2, lenh.length / cps);
      tl.to(p, { n: lenh.length, duration: d, ease: "none", onUpdate() { dong0.innerHTML = dauNhac + esc(lenh.slice(0, Math.round(p.n))); } }, t + 0.1);
      let tt = t + 0.1 + d + (a.chờ ?? 0.35);
      outs.forEach((e) => { tl.to(e, { opacity: 1, duration: 0.08 }, tt); tt += gian; });
      trangTruoc = tr;
      return tt;
    };
    return api;
  }
  vk.ide = ide;
})();
