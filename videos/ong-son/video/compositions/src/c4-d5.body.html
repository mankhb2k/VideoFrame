<script>
/*VK_JS*/
const D = 31.58;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const ke = vk.keGach(tl, root, { co: 3 });
const clip = document.getElementById("c4d5-clip");
const lan = vk.nv(root, { src: "assets/images/co-lan/quay-thu-ngan.png", size: 670, cx: 900, base: 1040, id: "c4d5-lan" });
lan.style.zIndex = 2; lan._bong.style.zIndex = 2;
const mt = vk.nv(root, { src: "assets/images/vat/may-tinh-tien-cu.png", size: 210, cx: 772, base: 808, id: "c4d5-mt", bong: false });
mt.style.zIndex = 3;
const gio = vk.nv(root, { src: "assets/images/vat/gio-hang-trong.png", size: 520, cx: 1440, base: 960, id: "c4d5-gio" });
gio.style.zIndex = 3; gio._bong.style.zIndex = 3;

// các món trong giỏ (thả vào theo thứ tự; món sau nằm trên)
const MON = {
  chai: { src: "vat/chai-nuoc-mam", size: 320, cx: 1330, base: 848, nhan: { x: 0.51, y: 0.64, w: 0.26, h: 0.36, t: "MẮM" } },
  gao:  { src: "vat/bao-gao", size: 240, cx: 1505, base: 794, nhan: { x: 0.515, y: 0.645, w: 0.47, h: 0.28, t: "GẠO" } },
  muoi: { src: "vat/bao-muoi", size: 240, cx: 1400, base: 786, nhan: { x: 0.51, y: 0.68, w: 0.42, h: 0.2, t: "MUỐI" } },
  mi:   { src: "vat/goi-mi-chinh", size: 280, cx: 1468, base: 820, nhan: { x: 0.51, y: 0.52, w: 0.4, h: 0.26, t: "MÌ<br>CHÍNH" } },
};
const SX = 985, SY = 655;           // đầu máy quét của Cô Lan
Object.entries(MON).forEach(([k, m]) => {
  const c = document.createElement("div"); c.className = "c4d5-it"; c.id = "c4d5-m-" + k; clip.appendChild(c);
  vk.nv(c, { src: "assets/images/" + m.src + ".png", size: m.size, cx: m.cx, base: m.base, bong: false });
  const n = document.createElement("div"); n.className = "c4d5-nhan"; n.innerHTML = m.nhan.t;
  const w = m.nhan.w * m.size, h = m.nhan.h * m.size;
  n.style.width = w + "px"; n.style.height = h + "px";
  n.style.left = m.cx - m.size / 2 + m.nhan.x * m.size - w / 2 + "px";
  n.style.top = m.base - m.size + m.nhan.y * m.size - h / 2 + "px";
  if (k === "mi" || k === "chai") n.style.fontSize = "24px";
  c.appendChild(n);
  m.el = c; m.cy = m.base - m.size / 2;
  gsap.set(c, { transformOrigin: m.cx + "px " + m.cy + "px" });
});
// món bay từ giỏ tới đầu máy quét rồi biến mất
function quet(m, t, dur) {
  const dx = SX - m.cx, dy = SY - m.cy;
  tl.fromTo(m.el, { x: 0, scale: 1, opacity: 1 }, { x: dx, scale: 0.55, duration: dur, ease: "power1.inOut", immediateRender: false }, t);
  tl.to(m.el, { keyframes: { y: [dy - 190, dy], easeEach: "sine.inOut" }, duration: dur }, t);
  tl.to(m.el, { opacity: 0, scale: 0.25, duration: 0.25, ease: "power2.in" }, t + dur);
  tl.fromTo("#c4d5-tia", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, t + dur - 0.05);
  tl.to("#c4d5-tia", { opacity: 0, duration: 0.18, ease: "power1.in" }, t + dur + 0.08);
}

// 0,0s: giỏ hàng bên phải hiện; các món rơi vào giỏ theo thứ tự (chai, gạo, muối, mì chính)
vk.pop(tl, gio, 0.0, { scale0: 0.75, dur: 0.45 });
tl.fromTo(gio._bong, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.0);
[["chai", 0.45], ["gao", 0.95], ["muoi", 1.45], ["mi", 1.95]].forEach(([k, t]) => {
  const m = MON[k];
  tl.fromTo(m.el, { y: -(m.base + 90), x: 0 }, { y: 0, duration: 0.75, ease: "bounce.out" }, t);
});
// 2,8s: Cô Lan quét món 1 (gói mì chính bay tới máy quét); chip "vòng 1"
vk.pop(tl, "#c4d5-v1", 2.8, { scale0: 0.6, dur: 0.45 });
quet(MON.mi, 2.8, 0.85);
// 5,4s: bong bóng "Còn món nào không?"; mũi tên cong quay lại giỏ
vk.pop(tl, "#c4d5-bubble", 5.4, { scale0: 0.7, dur: 0.5 });
vk.ve(tl, "#c4d5-ma", 5.7, 0.8);
// 6,7s: món 2 (bao muối) bay ra; chip "vòng 2"; mũi tên vòng lần hai
vk.pop(tl, "#c4d5-v2", 6.7, { scale0: 0.6, dur: 0.45 });
quet(MON.muoi, 6.7, 0.85);
vk.ve(tl, "#c4d5-mb", 7.2, 0.8);
// 10,2s: ngã ba đường nhỏ (đúng / sai) cạnh bong bóng
vk.ve(tl, "#c4d5-f0", 10.2, 0.25);
vk.ve(tl, "#c4d5-f1", 10.4, 0.4);
vk.ve(tl, "#c4d5-f2", 10.4, 0.4);
vk.pop(tl, "#c4d5-fk1", 10.6, { scale0: 0.7, dur: 0.45 });
vk.pop(tl, "#c4d5-fk2", 10.9, { scale0: 0.7, dur: 0.45 });
// 15,9s: các mũi tên khép thành vòng tròn hồng liền; chữ VÒNG LẶP (2 giây dừng)
tl.to(["#c4d5-bubble", "#c4d5-ma", "#c4d5-mb", "#c4d5-v1", "#c4d5-v2", "#c4d5-fk1", "#c4d5-fk2", "#c4d5-f0", "#c4d5-f1", "#c4d5-f2"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 15.7);
tl.fromTo("#c4d5-vong", { strokeDasharray: "1 1", strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 1.1, ease: "power1.inOut" }, 15.9);
tl.fromTo("#c4d5-vong-mt", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 16.9);
vk.pop(tl, "#c4d5-lap", 16.2, { scale0: 0.8, dur: 0.55 });
// 22,6s: cửa sổ code hai dòng; từ while sáng hồng đậm
vk.vao(tl, "#c4d5-cua", 22.4, { dy: 24, dur: 0.55 });
tl.fromTo("#c4d5-while", { backgroundColor: "rgba(236,72,153,0)", color: "#F9A8D4" }, { backgroundColor: "rgba(236,72,153,0.7)", color: "#FFFFFF", duration: 0.35, ease: "power2.out" }, 23.4);
vk.sangDong(tl, "#c4d5-l1", 24.0, 25.3, "rgba(236,72,153,0.22)");
vk.sangDong(tl, "#c4d5-l2", 25.3, 27.4, "rgba(59,130,246,0.25)");
// 26,0s: những món còn lại ra nhanh (quét tiếp) cho tới khi giỏ trống
quet(MON.gao, 25.6, 0.6);
quet(MON.chai, 26.05, 0.6);
// 26,8s: "Hết món": vòng tròn đứt rồi ngừng
tl.to("#c4d5-lap", { opacity: 0, duration: 0.4, ease: "power2.in" }, 26.7);
tl.to("#c4d5-vong", { strokeDasharray: "0.74 1", opacity: 0.3, duration: 0.5, ease: "power2.inOut" }, 26.8);
tl.to("#c4d5-vong-mt", { opacity: 0, duration: 0.3 }, 26.8);
// 27,2s: Cô Lan nhấn máy tính tiền (nảy); "TỔNG" xanh lá đậm (giữ ba giây)
vk.pop(tl, mt, 26.9, { scale0: 0.6, dur: 0.4 });
tl.to(lan, { y: 8, duration: 0.12, ease: "power2.out" }, 27.35).to(lan, { y: 0, duration: 0.3, ease: "back.out(2.4)" }, 27.47);
vk.nay(tl, mt, 27.35, { m: 1.14 });
vk.pop(tl, "#c4d5-tong", 27.45, { scale0: 0.7, dur: 0.5 });
window.__timelines["c4-d5"] = tl;
</script>
