<script>

const D = 19.64;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");

vk.keGach(tl, root, { co: 5 });
// Cô Lan giữa khung (quay-thu-ngan, size 720, đáy ảnh y=1070)

const lan = vk.nv(root, { src: "assets/images/co-lan/quay-thu-ngan.png", size: LS, cx: LX, base: LB, id: "c5d3-lan" });

const MX = LX - LS / 2 + 335 * LS / 1024;   // tâm ngang hộp đen
const MT = 533;                              // đỉnh ảnh máy
function datMay(id, src, tamX) {
  const w = document.createElement("div");
  w.className = "c5d3-mt"; w.id = id;
  w.style.left = Math.round(tamX - 0.53 * 290) + "px"; w.style.top = MT + "px";
  const im = document.createElement("img"); im.src = src; im.alt = ""; w.appendChild(im);
  root.appendChild(w); return w;
}
const cu = datMay("c5d3-cu", "assets/images/vat/may-tinh-tien-cu.png", MX);
const moi = datMay("c5d3-moi", "assets/images/vat/may-tinh-tien-moi.png", MX);
// màn hình máy mới: đa giác sáng + hai vòng "ting" (toạ độ theo ảnh 1024)
moi.insertAdjacentHTML("beforeend",
  '<svg viewBox="0 0 1024 1024">' +
  '<defs><linearGradient id="c5d3-gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0F9FF"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>' +

  '<polygon id="c5d3-man" points="325,152 712,152 637,488 232,462" fill="url(#c5d3-gr)"/>' +
  '<polygon id="c5d3-v1" points="325,152 712,152 637,488 232,462" fill="none" stroke="#38BDF8" stroke-width="14" />' +
  '<polygon id="c5d3-v2" points="325,152 712,152 637,488 232,462" fill="none" stroke="#38BDF8" stroke-width="10" />' +
  '</svg>');

// nhãn cuối đoạn
const nhanVo = document.createElement("div");
nhanVo.className = "c5d3-nhan c5d3-vo"; nhanVo.id = "c5d3-nvo";
nhanVo.style.left = "400px"; nhanVo.style.top = "640px";
nhanVo.innerHTML = 'VỎ <small>đổi</small><svg width="30" height="30" viewBox="0 0 30 30"><path d="M6 12 A9 9 0 0 1 23 9 M23 4 V10 H17 M24 18 A9 9 0 0 1 7 21 M7 26 V20 H13" fill="none" stroke="#111113" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const nhanNm = document.createElement("div");
nhanNm.className = "c5d3-nhan c5d3-nm"; nhanNm.id = "c5d3-nnm";
nhanNm.style.right = "416px"; nhanNm.style.top = "136px";
nhanNm.innerHTML = 'NỀN MÓNG <small>giữ nguyên</small><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#22C55E"/><path d="M8 15.5 L13 20 L22 10" fill="none" stroke="#111113" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
root.appendChild(nhanNm);
const vachVo = document.createElementNS("http://www.w3.org/2000/svg", "svg");
vachVo.setAttribute("width", "1920"); vachVo.setAttribute("height", "1080");
vachVo.style.cssText = "position:absolute;left:0;top:0;pointer-events:none";
vachVo.innerHTML = '<path id="c5d3-lv" class="vk-net vk-net-mong" d="M640 668 H745" pathLength="1"/>';
root.appendChild(vachVo);

// 0,6s: cắt vào quầy thu ngân: Cô Lan + máy tính tiền cũ
const nhom = [lan, lan._bong, cu];
tl.fromTo(nhom, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.6);
tl.set(moi, { opacity: 0 }, 0);
// 7,2s: "bình cũ, rượu mới" hiện trên đầu
vk.pop(tl, "#c5d3-bc", 7.2, { scale0: 0.85, dur: 0.55 });
// 8,7s: máy cũ trượt ra, máy mới trượt vào, màn hình sáng
tl.to(cu, { x: -320, opacity: 0, duration: 0.55, ease: "power2.in" }, 8.7);

tl.fromTo("#c5d3-v1", { scale: 1, opacity: 0.9, svgOrigin: "476 315" }, { scale: 1.5, opacity: 0, duration: 0.7, ease: "power2.out" }, 9.7);
tl.fromTo("#c5d3-v2", { scale: 1, opacity: 0.8, svgOrigin: "476 315" }, { scale: 1.9, opacity: 0, duration: 0.8, ease: "power2.out" }, 9.9);
// 12,7s: tiêu đề mờ đi; ba chip hiện lần lượt trên đầu Cô Lan
tl.to("#c5d3-bc", { opacity: 0, y: -10, duration: 0.35, ease: "power2.in" }, 12.3);

vk.vao(tl, "#c5d3-m1", 13.15, { dy: 0, dur: 0.3 });
vk.vao(tl, "#c5d3-b", 13.3, { dy: 22, dur: 0.5 });
vk.vao(tl, "#c5d3-m2", 13.75, { dy: 0, dur: 0.3 });
vk.vao(tl, "#c5d3-c", 13.9, { dy: 22, dur: 0.5 });
// 14,7s: chip "nhập giá" sáng
tl.to("#c5d3-a", { backgroundColor: "#FDBA74", borderColor: "#F26A21", duration: 0.3, ease: "power2.out" }, 14.7);
vk.nay(tl, "#c5d3-a", 14.7, { m: 1.1 });

</script>
