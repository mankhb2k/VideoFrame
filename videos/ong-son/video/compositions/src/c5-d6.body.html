<script>
/*VK_JS*/
const D = 31.39;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
// kệ gạch: 5 viên có sẵn suốt đoạn
vk.keGach(tl, root, { co: 5 });

// 0,4s: Ông Sơn trượt vào cạnh sơ đồ tiệm; bút đỏ vạch sơ đồ; hai chip hiện
const sm = vk.nv(root, { src: "assets/images/ong-son/goc.png", size: 700, cx: 270, base: 1050, id: "c5d6-son" });
tl.fromTo(sm, { x: -560 }, { x: 0, duration: 1.0, ease: "power3.out" }, 0.4);
tl.fromTo(sm._bong, { x: -560 }, { x: 0, duration: 1.0, ease: "power3.out" }, 0.4);
vk.vao(tl, "#c5d6-so", 0.6, { dy: 24 });
vk.ve(tl, "#c5d6-p1", 0.9, 0.8);
vk.ve(tl, "#c5d6-p2", 1.5, 0.4);
vk.ve(tl, "#c5d6-p3", 1.8, 0.4);
["#c5d6-z1", "#c5d6-z2", "#c5d6-z3"].forEach((z, i) => vk.vao(tl, z, 1.7 + i * 0.15, { dy: 10, dur: 0.4 }));
vk.vao(tl, "#c5d6-c1", 0.4, { dy: 22, dur: 0.5 });
vk.vao(tl, "#c5d6-c2", 0.75, { dy: 22, dur: 0.5 });

// 2,5s: chip "Kiến trúc sư" sáng; "Thợ code" mờ đi; ba câu hỏi hiện lần lượt
tl.fromTo("#c5d6-c2", { backgroundColor: "#FFFFFF" }, { backgroundColor: "#F26A21", duration: 0.3, ease: "power2.out" }, 2.5);
vk.nay(tl, "#c5d6-c2", 2.5, { m: 1.08 });
tl.to("#c5d6-c1", { opacity: 0.45, duration: 0.3 }, 2.5);
["#c5d6-q1", "#c5d6-q2", "#c5d6-q3"].forEach((q, i) => vk.vao(tl, q, 2.7 + i * 0.6, { dy: 26, dur: 0.5 }));

// sáng một thẻ câu hỏi (nền cam nhạt, viền cam), rồi trả về bình thường
const TRUNG = { backgroundColor: "#FFFFFF", borderColor: "#D2CCBE" };
const SANG = { backgroundColor: "#FFEBDB", borderColor: "#F26A21" };
const sangThe = (q, tOn, tOff) => {
  tl.fromTo(q, TRUNG, { ...SANG, duration: 0.25, ease: "power2.out" }, tOn);
  if (tOff != null) tl.to(q, { ...TRUNG, duration: 0.3, ease: "power2.in" }, tOff);
};
// 4,7s / 5,9s / 7,4s: lần lượt câu 1, 2, 3 sáng, bút đỏ gạch dưới
sangThe("#c5d6-q1", 4.7, 5.9); vk.ve(tl, "#c5d6-u1", 4.8, 0.5);
sangThe("#c5d6-q2", 5.9, 7.4); vk.ve(tl, "#c5d6-u2", 6.0, 0.5);
sangThe("#c5d6-q3", 7.4, 9.6); vk.ve(tl, "#c5d6-u3", 7.5, 0.6);

// 11,0s: ba viên gạch BIẾN, HÀM, DATABASE và ba mũi tên cong từ ba câu hỏi
[1, 2, 3].forEach((n, i) => {
  const t = 11.0 + i * 0.3;
  vk.pop(tl, "#c5d6-g" + n, t, { scale0: 0.5, dur: 0.45 });
  vk.ve(tl, "#c5d6-a" + n, t + 0.1, 0.5);
  tl.fromTo("#c5d6-h" + n, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t + 0.5);
});
// các mũi tên chưa vẽ thì ẩn (vk.ve đặt opacity 1 từ giây 0 nhưng dasharray che hết); đầu mũi tên đã ẩn bằng fromTo ở trên

// ghép cặp: thẻ viền màu khái niệm, mũi tên đổi màu, viên gạch nảy to ra và giữ
const CAP = [
  { q: "#c5d6-q1", g: "#c5d6-g1", a: "#c5d6-a1", h: "#c5d6-h1", dam: "#854D0E", nhat: "#FEF9C3", t: 15.0 },
  { q: "#c5d6-q2", g: "#c5d6-g2", a: "#c5d6-a2", h: "#c5d6-h2", dam: "#1D4ED8", nhat: "#DBEAFE", t: 17.2 },
  { q: "#c5d6-q3", g: "#c5d6-g3", a: "#c5d6-a3", h: "#c5d6-h3", dam: "#6D28D9", nhat: "#EDE9FE", t: 19.8 },
];
CAP.forEach((c) => {
  tl.fromTo(c.q, TRUNG, { backgroundColor: c.nhat, borderColor: c.dam, duration: 0.3, ease: "power2.out" }, c.t);
  tl.fromTo([c.a, c.h], { stroke: "#4B4B52" }, { stroke: c.dam, duration: 0.3, ease: "power2.out" }, c.t);
  tl.to(c.g, { scale: 1.3, duration: 0.14, ease: "power2.out" }, c.t).to(c.g, { scale: 1.2, duration: 0.3, ease: "back.out(2.4)" }, c.t + 0.14);
});

// 22,0s: câu 1 phóng lớn, các thứ khác lùi đi; chữ "ĐẶT TÊN" hiện cạnh
tl.to(["#c5d6-q2", "#c5d6-q3", "#c5d6-g1", "#c5d6-g2", "#c5d6-g3", "#c5d6-mt"], { opacity: 0, duration: 0.45, ease: "power2.in" }, 22.0);
tl.to("#c5d6-q1", { scale: 1.3, y: 110, duration: 0.7, ease: "power3.inOut" }, 22.0);
vk.pop(tl, "#c5d6-dt", 22.5, { scale0: 0.8, dur: 0.6 });

// 26,8s: "các bài sau" hiện, dấu X đỏ nhỏ nảy lên trên đó
