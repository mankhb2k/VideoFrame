<script>
/*VK_JS*/
const D = 20.86;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const ke = vk.keGach(tl, root, { co: 1 });
// người nhỏ (năm việc tách thành năm người): dựng SVG đơn giản cạnh nhau
const VIEC = ["thu ngân", "thủ kho", "bán hàng", "kế toán", "bảo vệ"];
const AO = ["#94A3B8", "#D6B88F", "#7DB5B0", "#D9B65C", "#B08968"];
VIEC.forEach((v, i) => {
  const p = document.getElementById("c2d5-p" + (i + 1));
  p.innerHTML = '<svg viewBox="0 0 104 134"><circle cx="52" cy="34" r="26" fill="#F6C9A0" stroke="#111113" stroke-width="3"/><path d="M26 32 C26 8 78 8 78 32 C70 20 36 20 26 32 Z" fill="#2B2B2F"/><circle cx="43" cy="37" r="3" fill="#111113"/><circle cx="61" cy="37" r="3" fill="#111113"/><path d="M45 47 Q52 53 59 47" fill="none" stroke="#111113" stroke-width="2.5" stroke-linecap="round"/><path d="M14 130 C14 84 28 70 52 70 C76 70 90 84 90 130 Z" fill="' + AO[i] + '" stroke="#111113" stroke-width="3" stroke-linejoin="round"/></svg><div class="vk-chip">' + v + '</div>';
});
// nhân vật
const son = vk.nv(root, { src: "assets/images/ong-son/goc.png", size: 660, cx: 330, base: 1052, id: "c2d5-son" });
const sonN = vk.nv(root, { src: "assets/images/ong-son/ngac-nhien.png", size: 660, cx: 330, base: 1052, id: "c2d5-sonn", bong: false });
const hung = vk.nv(root, { src: "assets/images/anh-hung/nam-mu.png", size: 700, cx: 960, base: 1055, id: "c2d5-hung" });
const hungV = vk.nv(root, { src: "assets/images/anh-hung/vay-chao.png", size: 700, cx: 960, base: 1055, id: "c2d5-hungv", bong: false });
const gw = document.createElement("div"); gw.className = "c2d5-gw"; gw.id = "c2d5-gw";
root.appendChild(gw);
const lan = vk.nv(gw, { src: "assets/images/co-lan/goc.png", size: 610, cx: 900, base: 1052, id: "c2d5-lan" });
const tam = vk.nv(gw, { src: "assets/images/anh-tam/goc.png", size: 610, cx: 1400, base: 1052, id: "c2d5-tam" });

tl.fromTo(son, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);

tl.fromTo(sonN, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

// 1,2s -> 2,2s: năm biểu tượng việc xếp vòng trên đầu

for (let i = 0; i < 4; i++) {
  tl.to(hung, { y: -14, duration: 0.45, ease: "sine.out" }, 3.3 + i * 0.9).to(hung, { y: 0, duration: 0.45, ease: "sine.in" }, 3.75 + i * 0.9);
}
vk.pop(tl, "#c2d5-ok1", 3.35, { scale0: 0.5, dur: 0.45 });
// 7,1s: Ông Sơn gọi, Anh Hùng đổi sang vẫy chào rồi trượt ra bên phải
tl.to(son, { opacity: 0, duration: 0.15 }, 6.95);
tl.to(sonN, { opacity: 1, duration: 0.15 }, 6.95);
vk.pop(tl, "#c2d5-bub", 7.0, { scale0: 0.7, dur: 0.4 });

tl.to(hungV, { opacity: 1, duration: 0.01 }, 7.1);
tl.to("#c2d5-ok1", { opacity: 0, duration: 0.2 }, 7.1);
tl.to("#c2d5-ok1", { opacity: 0, duration: 0.01 }, 7.3);
tl.to([hung, hung._bong, hungV], { x: 1500, duration: 1.0, ease: "power2.in" }, 7.3);
tl.to([".c2d5-c"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 7.9);
// 8,3s: cả tiệm đứng im: Lan, Tâm xám đi (30%), cửa sổ code một dòng
tl.to("#c2d5-bub", { opacity: 0, duration: 0.25, ease: "power2.in" }, 8.2);

// 12,0s: cảnh sống lại: hồi màu; năm biểu tượng tách thành năm người nhỏ

tl.to(gw, { opacity: 1, filter: "grayscale(0)", duration: 0.6, ease: "power2.out" }, 12.0);
tl.to(sonN, { opacity: 0, duration: 0.15 }, 12.0);
tl.to(son, { opacity: 1, duration: 0.15 }, 12.0);
for (let i = 1; i <= 5; i++) {
  tl.fromTo("#c2d5-p" + i, { x: 960 - (420 + (i - 1) * 210 + 120), y: 30, opacity: 0, scale: 0.4 }, { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.65, ease: "back.out(1.6)" }, 12.1 + (i - 1) * 0.14);
}

tl.to("#c2d5-p2", { opacity: 0, scale: 0.5, y: 24, duration: 0.45, ease: "power2.in" }, 17.0);

vk.pop(tl, "#c2d5-ok2", 17.4, { scale0: 0.5, dur: 0.5 });
window.__timelines["c2-d5"] = tl;
