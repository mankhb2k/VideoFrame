document.querySelectorAll(".c4d2-rain").forEach((l, i) => {
  tl.fromTo(l, { y: -130 }, { y: 470, duration: 1.0, ease: "none", repeat: 4 }, 1.5 + (i % 7) * 0.13);
});

// 3,2s: nhánh trái (nếu mưa thì mang ô); 4,7s: nhánh phải (không thì thôi); hai nhánh cùng sáng
