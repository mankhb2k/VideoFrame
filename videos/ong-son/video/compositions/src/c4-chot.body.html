<style>
/*VK_FONT*/
/*VK_CSS*/
#root { position: absolute; inset: 0; }
#c4c-wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 476px 90px; }
.c4c-halo { position: absolute; top: 48px; width: 144px; height: 84px; border-radius: 14px; filter: blur(16px); opacity: 0; }
.c4c-chu { position: absolute; left: 0; top: 660px; width: 1920px; text-align: center; }
.c4c-lb { position: absolute; left: 0; top: 660px; width: 1920px; display: flex; justify-content: center; align-items: center; gap: 28px; }
.c4c-lb .b { padding: 8px 30px; border: var(--vien-chip); border-radius: 16px; box-shadow: var(--bong-nho); color: var(--chu-tren-mau); font-size: 44px; font-weight: 800; white-space: nowrap; }
.c4c-lb .m { font-size: 80px; font-weight: 800; color: var(--muc); white-space: nowrap; }
.c4c-lb .a { font-size: 56px; font-weight: 800; color: var(--muc-mo); }
</style>
<div data-hf-id="hf-q1wn" id="root" data-composition-id="c4-chot" data-width="1920" data-height="1080">
  <div data-hf-id="hf-9neg" id="c4c-wrap"></div>
  <div data-hf-id="hf-j0id" class="vk-chu vk-chu-vua c4c-chu" id="c4c-t1">để tự quyết định</div>
  <div data-hf-id="hf-tsgr" class="vk-chu vk-chu-vua c4c-chu" id="c4c-t2">để làm đi làm lại</div>
  <div data-hf-id="hf-m8nw" class="c4c-lb" id="c4c-l0"><span data-hf-id="hf-axak" class="vk-chu b" style="background:var(--bien)">BIẾN</span><span data-hf-id="hf-jqfi" class="vk-chu a">→</span><span data-hf-id="hf-nqxj" class="vk-chu m">gọi tên</span></div>
  <div data-hf-id="hf-n0bp" class="c4c-lb" id="c4c-l1"><span data-hf-id="hf-3zz4" class="vk-chu b" style="background:var(--ham)">HÀM</span><span data-hf-id="hf-tfgy" class="vk-chu a">→</span><span data-hf-id="hf-j70k" class="vk-chu m">chia việc</span></div>
  <div data-hf-id="hf-qyfq" class="c4c-lb" id="c4c-l2"><span data-hf-id="hf-29q8" class="vk-chu b" style="background:var(--db)">DATABASE</span><span data-hf-id="hf-ttrz" class="vk-chu a">→</span><span data-hf-id="hf-ft4j" class="vk-chu m">để nhớ</span></div>
  <div data-hf-id="hf-x45j" class="c4c-lb" id="c4c-l3"><span data-hf-id="hf-bext" class="vk-chu b" style="background:var(--re)">IF / ELSE</span><span data-hf-id="hf-u830" class="vk-chu a">→</span><span data-hf-id="hf-50zt" class="vk-chu m">tự quyết định</span></div>
  <div data-hf-id="hf-129k" class="c4c-lb" id="c4c-l4"><span data-hf-id="hf-5maf" class="vk-chu b" style="background:var(--lap)">VÒNG LẶP</span><span data-hf-id="hf-ume1" class="vk-chu a">→</span><span data-hf-id="hf-85st" class="vk-chu m">làm lại</span></div>
</div>
<script>
/*VK_JS*/
const D = 21.53;
const tl = gsap.timeline({ paused: true });
const wrap = document.getElementById("c4c-wrap");
const MAU = ["var(--bien)", "var(--ham)", "var(--db)", "var(--re)", "var(--lap)"];
// quầng sáng sau từng ô của kệ (tạo trước để nằm dưới viên gạch)
const halo = MAU.map((m, i) => {
  const h = document.createElement("div");
  h.className = "c4c-halo"; h.style.left = 96 + i * 154 + "px"; h.style.background = m;
  wrap.appendChild(h); return h;
});
// kệ có sẵn 3 viên (BIẾN, HÀM, DATABASE), ô 4 và 5 trống
const ke = vk.keGach(tl, wrap, { co: 3 });
const bricks = Array.from(ke.querySelectorAll(".vk-gach"));

// 0,1s: IF/ELSE lớn (x2,5) rơi giữa khung, nảy một lần; 4,6s bay lên ô 4 (sớm 0,1s để không đè viên sau)
const g4 = vk.gachLon(tl, wrap, { i: 4, t: 0.1, tBay: 4.6, durBay: 0.85, scale: 2.5, cx: 960, cy: 470 });
vk.vao(tl, "#c4c-t1", 0.8, { dy: 24 });
tl.to("#c4c-t1", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.55);
vk.nay(tl, g4, 5.45);
// 4,7s: VÒNG LẶP lớn rơi giữa khung; 9,5s bay lên ô 5 (kệ đầy)
const g5 = vk.gachLon(tl, wrap, { i: 5, t: 4.7, tBay: 9.5, durBay: 0.9, scale: 2.5, cx: 960, cy: 470 });
vk.vao(tl, "#c4c-t2", 5.5, { dy: 24 });
tl.to("#c4c-t2", { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.3);
vk.nay(tl, g5, 10.4);
bricks.push(g4, g5);

// 9,6s tới 16,2s: từng viên sáng cùng chữ bên dưới (các viên khác mờ đi)
const tOn = [9.6, 11.0, 12.5, 14.8, 16.2, 17.9];
const dim = 0.4;
[1, 2, 3].forEach((i) => tl.to(bricks[i], { opacity: dim, duration: 0.25, ease: "power2.out" }, 9.5));
tl.to(bricks[4], { opacity: dim, duration: 0.25, ease: "power2.out" }, 10.4);
for (let i = 0; i < 5; i++) {
  const on = tOn[i], off = tOn[i + 1];
  const lb = "#c4c-l" + i;
  if (i > 0) tl.to(bricks[i], { opacity: 1, duration: 0.2, ease: "power2.out" }, on);
  tl.fromTo(halo[i], { opacity: 0 }, { opacity: 0.85, duration: 0.25, ease: "power2.out" }, on);
  if (i > 0 || on > 0) vk.nay(tl, bricks[i], on, { m: 1.14 });
  vk.vao(tl, lb, on, { dy: 20, dur: 0.4 });
  if (i < 4) {
    tl.to(bricks[i], { opacity: dim, duration: 0.25, ease: "power2.in" }, off);
    tl.to(halo[i], { opacity: 0, duration: 0.25, ease: "power2.in" }, off);
  }
  tl.to(lb, { opacity: 0, duration: 0.25, ease: "power2.in" }, off - (i === 4 ? 0.1 : 0.05));
}
// 17,9s: cả năm viên sáng cùng lúc, kệ phóng 1,15 lần, nảy nhẹ
bricks.forEach((b) => { tl.to(b, { opacity: 1, duration: 0.25, ease: "power2.out" }, 17.9); vk.nay(tl, b, 17.9, { m: 1.1 }); });
halo.forEach((h) => tl.to(h, { opacity: 0.85, duration: 0.25, ease: "power2.out" }, 17.9));
tl.fromTo(wrap, { scale: 1, x: 0, y: 0 }, { scale: 1.15, duration: 0.45, ease: "back.out(2.2)" }, 17.9);
// 19,4s: kệ trượt về giữa khung, phóng 1,6 lần, giữ hình tới hết
tl.to(wrap, { x: 484, y: 450, scale: 1.6, duration: 1.1, ease: "power3.inOut" }, 19.4);
window.__timelines["c4-chot"] = tl;
</script>
