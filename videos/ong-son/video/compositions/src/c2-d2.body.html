/*VK_JS*/
const D = 24.78;
const tl = gsap.timeline({ paused: true });

const lan = vk.nv(root, { src: "assets/images/co-lan/quay-thu-ngan.png", size: 600, cx: 420, base: 1060, id: "c2d2-lan" });

document.getElementById("c2d2-hop-ruot").textContent = "giá × số ký";

// 0,5s: Cô Lan trượt vào sau quầy từ trái; Ông Sơn nhỏ hiện cạnh quầy và chỉ tay

tl.fromTo(lan._bong, { x: -700, opacity: 1 }, { x: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 0.5);
tl.fromTo(son, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.4);
tl.fromTo(son._bong, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.4);
tl.to(son, { rotation: -4, duration: 0.35, ease: "sine.inOut" }, 2.2).to(son, { rotation: 0, duration: 0.5, ease: "sine.inOut" }, 2.55);
vk.vao(tl, "#c2d2-the", 1.7, { dy: 16, dur: 0.5 });

// 4,0s: sơ đồ: hộp "tính tiền", hai mũi tên vào, một mũi tên ra (mờ); hai chip vào hiện bên trái, rồi bay vào hộp
vk.vao(tl, "#c2d2-hop", 3.8, { dy: 20, dur: 0.5 });
["#c2d2-m1", "#c2d2-m2", "#c2d2-m3"].forEach((s) => vk.ve(tl, s, 4.0, 0.7));
vk.vao(tl, "#c2d2-c1", 4.0, { dy: 18, dur: 0.5 });
vk.vao(tl, "#c2d2-c2", 4.5, { dy: 18, dur: 0.5 });
tl.to("#c2d2-c1", { x: 355, y: 87, scale: 0.4, opacity: 0, duration: 0.8, ease: "power2.in" }, 5.4);
tl.to("#c2d2-c2", { x: 400, y: -73, scale: 0.4, opacity: 0, duration: 0.8, ease: "power2.in" }, 5.6);
vk.nay(tl, "#c2d2-hop", 6.2, { m: 1.05 });

// 7,4s: hộp thành hộp đen kín (không cần nhìn bên trong)

tl.fromTo("#c2d2-c2", { opacity: 0, scale: 0.6, x: 0, y: 0 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.45, ease: "back.out(1.9)", immediateRender: false }, 9.9);

// 19,7s: sơ đồ mờ đi, cửa sổ code hiện (dừng 3 giây); tinh_tien sáng viền xanh dương

tl.to("#c2d2-dt", { keyframes: { y: [(Y0 + Y1) / 2 - 140, Y1], easeEach: "sine.inOut" }, duration: 0.8 }, 23.3);
