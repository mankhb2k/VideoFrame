<script>
/*VK_JS*/
const D = 22.67;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");

// kệ gạch (đủ 5 viên) ở góc trên trái, thêm 4 ô mờ cho các video sau
const ke = vk.keGach(tl, root, { co: 5 });
ke.style.zIndex = "30";
const GHOST = ["BẢO VỆ", "GIAO DIỆN", "CHI NHÁNH QUA MẠNG", "XỬ LÝ LỖI"];
const ghosts = GHOST.map((ten, k) => {
  const i = 5 + k;
  const o = document.createElement("div"); o.className = "vk-o"; o.style.left = i * 154 + "px"; o.id = "c5k-o" + k;
  const n = document.createElement("div"); n.className = "c5k-nhan vk-chu"; n.style.left = i * 154 + "px"; n.textContent = ten; n.id = "c5k-n" + k;
  ke.appendChild(o); ke.appendChild(n);
  return [o, n];
});
const bv = document.createElement("div");
bv.className = "c5k-bv vk-chu"; bv.style.left = 5 * 154 + "px"; bv.textContent = "BẢO VỆ"; bv.id = "c5k-bv";
ke.appendChild(bv);
gsap.set([].concat(...ghosts), { opacity: 0 });
tl.set(ke, { opacity: 1 }, 0);

// nhân vật
const son = vk.nv(root, { src: "assets/images/ong-son/ngac-nhien.png", size: 660, cx: 1500, base: 1052, id: "c5k-son" });
const hanh = vk.nv(root, { src: "assets/images/chi-hanh/goc.png", size: 620, cx: 600, base: 1052, id: "c5k-hanh" });
const trom = vk.nv(root, { src: "assets/images/ten-trom/goc.png", size: 600, cx: 960, base: 1050, id: "c5k-trom" });
const bong2 = vk.nv(root, { src: "assets/images/ten-trom/goc.png", size: 600, cx: 1130, base: 1050, id: "c5k-bong2", bong: false });
const trom2 = vk.nv(root, { src: "assets/images/ten-trom/goc.png", size: 560, cx: 1230, base: 1052, id: "c5k-trom2" });
[trom, trom2, bong2].forEach((e) => { gsap.set(e, { scaleX: -1 }); });
gsap.set(bong2, { filter: "brightness(0) drop-shadow(0 0 0 #000)" });
bong2.style.zIndex = "1"; document.getElementById("c5k-so").style.zIndex = "2";
gsap.set([son, son._bong, hanh, hanh._bong, trom, trom._bong, bong2, trom2, trom2._bong], { opacity: 0 });
const BAI = [];
for (let i = 0; i < 5; i++) {
  const b = document.createElement("img");
  b.className = "vk-abs"; b.src = "assets/images/vat/chai-nuoc-mam.png"; b.alt = ""; b.style.width = "200px"; b.style.height = "200px"; b.id = "c5k-chai" + i;
  b.style.zIndex = "6"; root.appendChild(b); BAI.push(b);
}
gsap.set(BAI, { opacity: 0 });
["#c5k-so", "#c5k-lai", "#c5k-dem", "#c5k-dems", "#c5k-hoi", "#c5k-ai", "#c5k-la", "#c5k-ok", "#c5k-auth", "#c5k-sub", "#c5k-gia2", "#c5k-vong", "#c5k-gach"].forEach((s) => gsap.set(s, { opacity: 0 }));
gsap.set("#c5k-dem", { opacity: 0 });
[son, son._bong].forEach((e) => (e.style.zIndex = "4"));
document.getElementById("c5k-dem").style.zIndex = "5";
document.getElementById("c5k-dems").style.zIndex = "8";
[trom, trom._bong].forEach((e) => (e.style.zIndex = "7"));

// 0,2s: cảnh tiệm đông khách ấm, chữ "Nhưng đời không như mơ"; mờ đi và nền tối xanh dần tới 2,2s
vk.vao(tl, "#c5k-td", 0.2, { dy: 22, dur: 0.6 });
tl.to("#c5k-td", { opacity: 0, duration: 0.4, ease: "power2.in" }, 1.7);
tl.fromTo("#c5k-dem", { opacity: 0 }, { opacity: 0.8, duration: 0.9, ease: "power1.inOut" }, 1.2);

// 2,3s: một buổi sáng: cắt sang cuốn sổ kế toán; Ông Sơn trượt vào xem
tl.to("#c5k-nen", { opacity: 0, duration: 0.05 }, 2.3);
tl.to("#c5k-dem", { opacity: 0, duration: 0.05 }, 2.3);
vk.vao(tl, "#c5k-so", 2.4, { dy: 26, dur: 0.6 });
tl.fromTo(son, { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.6);
tl.fromTo(son._bong, { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.6);

// 6,5s: nét bút đỏ gạch "45.000đ", hiện "1.000đ" đỏ đậm kèm dấu X; ô giá nháy đỏ
tl.fromTo("#c5k-gach", { strokeDasharray: 1, strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power1.inOut" }, 6.5);
vk.pop(tl, "#c5k-gia2", 7.1, { scale0: 0.6, dur: 0.5 });
tl.to("#c5k-gia", { opacity: 0.45, duration: 0.3 }, 7.1);
tl.fromTo("#c5k-r2", { backgroundColor: "rgba(254,226,226,0)" }, { backgroundColor: "rgba(254,226,226,1)", duration: 0.3, ease: "power2.out" }, 6.9);
tl.to("#c5k-r2", { backgroundColor: "rgba(254,226,226,0.55)", duration: 0.6, ease: "power2.inOut" }, 7.3);

// 8,5s: cả đêm: nền tối; tên trộm rón rén lướt từ trái sang phải; chai nước mắm bay theo cung ra cửa
tl.fromTo("#c5k-dem", { opacity: 0 }, { opacity: 0.82, duration: 0.6, ease: "power1.inOut" }, 8.5);
tl.to([son, son._bong], { opacity: 0, duration: 0.3 }, 8.5);
tl.fromTo(trom, { x: -1300, opacity: 1 }, { x: 1500, duration: 3.4, ease: "none" }, 8.6);
tl.fromTo(trom._bong, { x: -1300, opacity: 1 }, { x: 1500, duration: 3.4, ease: "none" }, 8.6);
const chaiTu = [[700, 640], [760, 700], [820, 650], [880, 710], [940, 660]];
BAI.forEach((b, i) => {
  const t0 = 8.9 + i * 0.45;
  vk.cung(tl, b, { t: t0, dur: 1.05, x0: chaiTu[i][0], y0: chaiTu[i][1], x1: 2050, y1: 760 + (i % 2) * 60, cao: -190, r0: -10, r1: 25, s0: 0.8, s1: 1, hien0: false });
});
// 10,1s: bộ đếm "−60 chai"
vk.vao(tl, "#c5k-dems", 8.9, { dy: 18, dur: 0.4 });
vk.dem(tl, "#c5k-dems", { tu: 0, den: 60, tien: "−", hau: " chai", t: 9.0, dur: 2.2, ease: "power1.inOut" });
tl.to("#c5k-dems", { opacity: 0, duration: 0.35, ease: "power2.in" }, 11.0);

// 11,2s: trời sáng lại; thanh lãi tụt về 0, "Lãi: 0đ" đỏ kèm dấu X; Ông Sơn ôm đầu (rung nhẹ)
tl.to("#c5k-dem", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 11.1);
tl.to([trom, trom._bong], { opacity: 0, duration: 0.2 }, 11.9);
tl.to([son, son._bong], { opacity: 1, duration: 0.4 }, 11.2);
vk.vao(tl, "#c5k-lai", 11.2, { dy: 24, dur: 0.5 });
tl.fromTo("#c5k-lai-m", { scaleX: 1 }, { scaleX: 0, duration: 1.0, ease: "power2.in" }, 11.8);
tl.fromTo("#c5k-lai-s", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 12.7);
tl.to(son, { keyframes: { rotation: [-3, 3, -2, 2, 0], easeEach: "sine.inOut" }, duration: 0.8 }, 11.6);

// 13,1s: dấu hỏi lớn trên cuốn sổ; bóng đen của tên trộm hiện mờ phía sau
vk.pop(tl, "#c5k-hoi", 13.1, { scale0: 0.4, dur: 0.55 });
tl.fromTo(bong2, { opacity: 0 }, { opacity: 0.26, duration: 0.7, ease: "power1.out" }, 13.2);
tl.to("#c5k-lai", { opacity: 0.2, duration: 0.4 }, 13.1);

// 14,7s: Chị Hạnh và tên trộm cạnh nhau, chip "ai là ai?" ở giữa; sổ nhỏ lại giữa hai người
tl.to([son, son._bong, bong2, "#c5k-hoi", "#c5k-lai"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 14.6);
tl.to("#c5k-so", { scale: 0.62, x: 80, y: 280, duration: 0.7, ease: "power2.inOut" }, 14.7);
tl.fromTo(hanh, { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 14.9);
tl.fromTo(hanh._bong, { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 14.9);
tl.fromTo(trom2, { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 15.1);
tl.fromTo(trom2._bong, { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 15.1);
vk.pop(tl, "#c5k-ai", 16.3, { scale0: 0.7, dur: 0.5 });

// 18,2s: vòng đỏ khoanh tên trộm, chip "kẻ lạ"; Chị Hạnh có dấu tích xanh
tl.fromTo("#c5k-vong", { strokeDasharray: 1, strokeDashoffset: 1, opacity: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power1.inOut" }, 18.2);
vk.pop(tl, "#c5k-la", 18.5, { scale0: 0.6, dur: 0.45 });
vk.pop(tl, "#c5k-ok", 18.9, { scale0: 0.6, dur: 0.45 });

// 19,5s: cảnh sạch; kệ gạch mở rộng thêm bốn ô mờ (bảo vệ, giao diện, chi nhánh qua mạng, xử lý lỗi)
tl.to([hanh, hanh._bong, trom2, trom2._bong, "#c5k-so", "#c5k-ai", "#c5k-la", "#c5k-ok", "#c5k-vong"], { opacity: 0, duration: 0.5, ease: "power2.in" }, 19.4);
ghosts.forEach(([o, n], k) => {
  tl.fromTo([o, n], { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 19.7 + k * 0.3);
});
// 21,8s: ô BẢO VỆ sáng, chữ AUTHENTICATION hiện giữa khung
tl.fromTo(bv, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.9)" }, 21.8);
tl.to(ghosts[0][1], { opacity: 0, duration: 0.15 }, 21.8);
vk.pop(tl, "#c5k-auth", 21.9, { scale0: 0.85, dur: 0.6 });
vk.vao(tl, "#c5k-sub", 22.2, { dy: 14, dur: 0.4 });
window.__timelines["c5-chot"] = tl;
</script>
