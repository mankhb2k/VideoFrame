/*VK_JS*/
const D = 27.09;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");

// 0,3s: camera lùi lên khỏi mái (zoom out 1,6 -> 1); mái mờ đi, sơ đồ phẳng lộ ra
tl.fromTo("#c5d1-plan", { scale: 1.6 }, { scale: 1, duration: 3.1, ease: "power2.inOut" }, 0.3);
tl.to("#c5d1-mai", { opacity: 0, duration: 1.4, ease: "power1.inOut" }, 1.2);
tl.fromTo("#c5d1-in", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 1.5);
vk.ve(tl, "#c5d1-w0", 1.0, 1.6);
vk.ve(tl, "#c5d1-w1", 1.5, 1.4);
vk.ve(tl, "#c5d1-w2", 1.7, 1.5);

// 3,9s: năm ô trống viền đứt nét hiện, đánh số 1-5
const O = [
  { cx: 300, cy: 345 }, { cx: 875, cy: 345 }, { cx: 1385, cy: 345 }, { cx: 580, cy: 650 }, { cx: 1260, cy: 760 },
];
O.forEach((o, i) => {
  const sv = o.cx + " " + o.cy;
  tl.fromTo("#c5d1-o" + (i + 1), { opacity: 0, scale: 0.8, svgOrigin: sv }, { opacity: 1, scale: 1, svgOrigin: sv, duration: 0.45, ease: "back.out(1.8)" }, 3.9 + i * 0.22);
});

// viên gạch bay từ kệ vào khu của nó, đậu vào ô (cạch), khu sáng màu khái niệm
function bay(i, t, o) {
  const el = document.createElement("div");
  el.className = "vk-gach vk-gach-" + vk.GACH[i].lop; el.textContent = vk.GACH[i].ten;
  el.style.left = "0px"; el.style.top = "0px"; el.style.zIndex = "6"; el.style.opacity = "0";
  root.appendChild(el);
  const x0 = 96 + i * 154, y0 = 48, x1 = o.cx - 72, y1 = o.cy - 42, d = 1.0, ymid = (y0 + y1) / 2 - 90;
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
  tl.fromTo(el, { x: x0, y: y0, scale: 1 }, { x: x1, scale: 1.35, duration: d, ease: "power2.inOut" }, t);
  tl.to(el, { keyframes: { y: [ymid, y1], easeEach: "sine.inOut" }, duration: d }, t);
  tl.to(el, { scale: 1.5, duration: 0.12, ease: "power2.out" }, t + d).to(el, { scale: 1.35, duration: 0.28, ease: "back.out(2.4)" }, t + d + 0.12);
  tl.to("#c5d1-o" + (i + 1), { opacity: 0, duration: 0.25, ease: "power2.in" }, t + d);
  tl.to("#c5d1-t" + (i + 1), { opacity: 0.9, duration: 0.5, ease: "power2.out" }, t + d);
}
bay(0, 7.7, O[0]);    // 7,8s: BIẾN vào khu nhãn cạnh thùng gạo
bay(1, 10.8, O[1]);   // 10,9s: HÀM vào quầy thu ngân
bay(2, 14.1, O[2]);   // 14,2s: DATABASE vào phòng kế toán
bay(3, 17.5, O[3]);   // 17,6s: IF/ELSE vào ngã ba đường
bay(4, 21.5, O[4]);   // 21,6s: VÒNG LẶP vào vòng tròn; năm viên nằm trên sơ đồ, giữ hình tới hết
window.__timelines["c5-d1"] = tl;
</script>
