<script>
/*VK_JS*/
const D = 30.8;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");

// ---- Trạng thái đầu = cuối đoạn 3 (cắt thẳng): nền tiệm, Ông Sơn, ba thùng 400 px xếp ngang với nhãn tên
const sm = vk.nv(root, { src: "assets/images/ong-son/goc.png", size: 640, cx: 250, base: 1040, id: "c1d4-son" });
const LOAI = [
  { ten: "ST25", ten2: "gia_gao_st25", w: 100, h: 42, L0: 400, gia: "30.000đ", len: 12, rg: 482 },
  { ten: "Jasmine", ten2: "gia_gao_jasmine", w: 124, h: 42, L0: 920, gia: "20.000đ", len: 15, rg: 494 },
  { ten: "Gạo<br>thường", ten2: "gia_gao_thuong", w: 106, h: 64, L0: 1440, gia: "15.000đ", len: 14, rg: 480 },
];
const CHAR = 22.8, TEXT_X = 993;                 // JetBrains Mono 38px: mỗi ký tự 0,6em = 22,8 px; lề chữ trong cửa sổ
const DONG = [0, 1, 2].map((i) => document.getElementById("c1d4-d" + (i + 1)));
const lineY = (i) => 400 + 42 + 22 + 58.9 * (i + 0.5);       // tâm dòng code i (đầu cửa sổ ~42 px, đệm 22 px, dòng cao 58,9 px)
const CX = 450, T0 = 125, PITCH = 280;                        // cột thùng bên trái: tâm x, đỉnh hộp thùng 1, bước dọc
const TH = [], NHAN = [], GLOW = [];
LOAI.forEach((l, i) => {
  const th = document.createElement("img");
  th.className = "c1d4-thung"; th.src = "assets/images/vat/thung-gao.png"; th.alt = ""; th.id = "c1d4-thung" + i;
  root.appendChild(th); TH.push(th);
  const nh = document.createElement("div");
  nh.className = "c1d4-nhan"; nh.id = "c1d4-nhan" + i;
  nh.style.width = l.w + "px"; nh.style.height = l.h + "px"; nh.style.margin = -l.h / 2 + "px 0 0 " + -l.w / 2 + "px";
  nh.innerHTML = l.ten + '<div class="c1d4-vang" id="c1d4-vang' + i + '"></div>';
  root.appendChild(nh); NHAN.push(nh); GLOW.push(nh.querySelector(".c1d4-vang"));
  const yBox = T0 + i * PITCH, xBox = CX - 140;
  l.x1 = xBox + 104; l.y1 = yBox + 182;                       // tâm vùng nhãn của thùng cỡ 280
});

// 0,1s: khung chia đôi. Ba thùng thu nhỏ sang trái xếp dọc, nền tiệm mờ đi, Ông Sơn rời khung, đường chia vẽ xuống, cửa sổ code trượt vào từ phải (0,6 giây)
tl.fromTo("#c1d4-nen", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 0.1);
tl.to([sm, sm._bong], { x: -800, duration: 0.6, ease: "power2.in" }, 0.1);
LOAI.forEach((l, i) => {
  tl.fromTo(TH[i], { x: l.L0 + 60, y: 554, scale: 400 / 280 }, { x: CX - 140, y: T0 + i * PITCH, scale: 1, duration: 0.6, ease: "power3.inOut" }, 0.1);
  tl.fromTo(NHAN[i], { x: l.L0 + 148, y: 754, rotation: 10 }, { x: l.x1, y: l.y1, rotation: 10, duration: 0.6, ease: "power3.inOut" }, 0.1);
});
tl.fromTo("#c1d4-chia", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 0.1);
tl.fromTo("#c1d4-cua", { x: 900, opacity: 1 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0.1);

// ---- Mũi tên nối từ dòng code tới nhãn (SVG: đường vẽ dần + đầu mũi)
LOAI.forEach((l, i) => {
  const yL = lineY(i), yP = l.y1, e = l.rg;
  document.getElementById("c1d4-m" + (i + 1)).setAttribute("d", "M958 " + yL + " C 780 " + yL + ", 650 " + yP + ", " + e + " " + yP);
  document.getElementById("c1d4-h" + (i + 1)).setAttribute("d", "M" + (e + 20) + " " + (yP - 14) + " L" + e + " " + yP + " L" + (e + 20) + " " + (yP + 14));
});
const ve3 = (i, t) => { vk.ve(tl, "#c1d4-m" + (i + 1), t, 0.8); tl.fromTo("#c1d4-h" + (i + 1), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, t + 0.7); };
const sangNhan = (i, tOn, tOff) => {
  tl.fromTo(GLOW[i], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, tOn);
  if (tOff != null) tl.to(GLOW[i], { opacity: 0, duration: 0.3, ease: "power2.in" }, tOff);
};
const dan = (i, t) => {  // chiếc nhãn nhỏ bằng chữ (giá) bay từ dấu = dán lên thùng
  const the = document.createElement("div");
  the.className = "vk-chip th-gia c1d4-the"; the.id = "c1d4-the" + i; the.textContent = LOAI[i].gia;
  root.appendChild(the);
  const xe = TEXT_X + (LOAI[i].len + 1) * CHAR + CHAR / 2;
  vk.cung(tl, the, { t, dur: 0.8, x0: xe, y0: lineY(i), x1: CX + 52, y1: T0 + i * PITCH + 70, cao: -170, r0: 0, r1: -6, s0: 0.5, s1: 1, hien0: false });
  vk.nay(tl, the, t + 0.8, { m: 1.12 });
  tl.to("#c1d4-eq" + (i + 1), { scale: 1.3, duration: 0.15, ease: "power2.out" }, t).to("#c1d4-eq" + (i + 1), { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t + 0.15);
};

// 3,8s: dòng 1 sáng, nhãn thùng 1 phát sáng viền vàng, mũi tên nối gia_gao_st25 với nhãn
vk.sangDong(tl, DONG[0], 3.8, 17.6);
sangNhan(0, 3.8, 17.6);
ve3(0, 3.8);
// 7,9s: dấu = phóng 1,3 lần, chiếc nhãn nhỏ (giá) bay theo cung từ dấu = dán lên thùng 1
dan(0, 7.9);
// 12,9s: chú thích đọc hiện dưới code, từng chữ sáng theo giọng đọc
vk.vao(tl, "#c1d4-cap", 12.9, { dy: 18, dur: 0.5 });
document.querySelectorAll("#c1d4-cap .c1d4-w").forEach((w, i) => {
  const tt = [13.4, 13.85, 14.3, 14.85, 15.35, 15.75][i];
  tl.to(w, { backgroundColor: "#FEF9C3", color: "#111113", duration: 0.25, ease: "power2.out" }, tt);
});
// 16,8s: chú thích và tờ nhãn trên thùng 1 cùng nháy một lần
vk.nay(tl, "#c1d4-cap", 16.8, { m: 1.05 });
vk.nay(tl, NHAN[0], 16.8, { m: 1.18 });
tl.to(GLOW[0], { opacity: 0.25, duration: 0.15, ease: "power2.in" }, 16.8).to(GLOW[0], { opacity: 1, duration: 0.25, ease: "power2.out" }, 16.95);
// 20,8s: dòng 2 rồi dòng 3 sáng lần lượt (0,8 giây mỗi dòng), nhãn thùng 2 và 3 sáng theo
vk.sangDong(tl, DONG[1], 20.8, 21.6);
sangNhan(1, 20.8, 21.6);
ve3(1, 20.8);
dan(1, 20.9);
vk.sangDong(tl, DONG[2], 21.6, 22.4);
sangNhan(2, 21.6, 22.4);
ve3(2, 21.6);
dan(2, 21.7);
// 23,0s: cả ba dòng và ba nhãn sáng đồng thời (giữ tới hết đoạn); 26,1s: giữ nguyên hình
DONG.forEach((d) => vk.sangDong(tl, d, 23.0, null));
[0, 1, 2].forEach((i) => sangNhan(i, 23.0, null));
window.__timelines["c1-d4"] = tl;
</script>
