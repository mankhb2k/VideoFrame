<style>
/*VK_FONT*/
/*VK_CSS*/
#root { position: absolute; inset: 0; }
.c1d2-nen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.c1d2-bao { position: absolute; left: 0; top: 0; width: 240px; height: 240px; transform-origin: 50% 50%; filter: drop-shadow(0 8px 10px var(--nv-bong)); pointer-events: none; }
#c1d2-pile { position: absolute; left: 0; top: 0; width: 1px; height: 1px; }
.c1d2-hoi { position: absolute; left: 1470px; top: 250px; width: 140px; text-align: center; font-size: 128px; font-weight: 800; line-height: 1; }
</style>
<div data-hf-id="hf-6sxc" id="root" data-composition-id="c1-d2" data-width="1920" data-height="1080">
  <img data-hf-id="hf-vlap" class="c1d2-nen" id="c1d2-nen" src="assets/images/nen/mat-bang-trong.png" alt="">
  <div data-hf-id="hf-mqr0" id="c1d2-pile"></div>
  <div data-hf-id="hf-9tyz" class="vk-chu c1d2-hoi" id="c1d2-hoi">?</div>
</div>
<script>
/*VK_JS*/
const D = 12.1;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const pile = document.getElementById("c1d2-pile");

// Xe tải đỗ dưới lòng đường (đáy ảnh 1144, bánh xe chạm nhựa đường khoảng y 1045; vỉa hè kết thúc ở y 1000), Ông Sơn đi từ vị trí cuối đoạn 1 sang phải
const xe = vk.nv(root, { src: "assets/images/vat/xe-tai.png", size: 640, cx: 340, base: 1144, id: "c1d2-xe" });
const smA = vk.nv(root, { src: "assets/images/ong-son/cam-tien.png", size: 760, cx: 560, base: 1030, id: "c1d2-son-a" });
const smB = vk.nv(root, { src: "assets/images/ong-son/goc.png", size: 660, cx: 1540, base: 1040, id: "c1d2-son-b" });

// 0,6s: xe tải trượt vào từ trái, dừng trước tiệm; Ông Sơn đổi sang dáng gốc và đi sang đứng cạnh
tl.fromTo([xe, xe._bong], { x: -760 }, { x: 0, duration: 1.5, ease: "power3.out" }, 0.6);
tl.fromTo(smA, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 0.6);
tl.fromTo(smA._bong, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, 0.6);
// ảnh dáng gốc cỡ 660 đặt ở vị trí tâm 560 (lệch -980), phóng 1,15 cho khớp cỡ ảnh trước, rồi đi tới chỗ đứng
tl.set(smB, { x: -980, scale: 1.15, opacity: 0 }, 0);
tl.set(smB._bong, { x: -980, opacity: 0 }, 0);
tl.to(smB, { opacity: 1, duration: 0.15, ease: "none" }, 0.6);
tl.to(smB, { x: 0, scale: 1, duration: 1.3, ease: "power2.inOut" }, 0.6);
tl.to(smB._bong, { opacity: 1, duration: 0.15, ease: "none" }, 0.6);
tl.to(smB._bong, { x: 0, duration: 1.3, ease: "power2.inOut" }, 0.6);

// 2,6s: chín bao gạo bay theo cung từ thùng xe vào giữa tiệm, mỗi bao nảy một lần, xoay lệch cố định
const ROT = [-8, 5, 11, -4, 9, -12, 3, -6, 7];
const PX = 1020;
const DICH = [ // tâm bao khi chất thành đống (bốn, ba, hai bao)
  [PX - 225, 809], [PX - 75, 809], [PX + 75, 809], [PX + 225, 809],
  [PX - 150, 694], [PX, 694], [PX + 150, 694],
  [PX - 75, 579], [PX + 75, 579],
];
const BAO = [];
DICH.forEach((d, i) => {
  const b = document.createElement("img");
  b.className = "c1d2-bao"; b.src = "assets/images/vat/bao-gao.png"; b.alt = ""; b.id = "c1d2-bao" + i;
  pile.appendChild(b); BAO.push(b);
  const t0 = 2.6 + i * 0.3;
  const sx = 190 + (i % 3 - 1) * 70 - 120, sy = 595 + 134 - 120;   // vị trí xuất phát: miệng thùng xe (đã hạ xuống đường 134 px)
  vk.cung(tl, b, { t: t0, dur: 0.8, x0: sx, y0: sy, x1: d[0] - 120, y1: d[1] - 120, cao: -190, r0: -30, r1: ROT[i], s0: 0.55, s1: 1, hien0: false });
  vk.nay(tl, b, t0 + 0.8, { m: 1.07 });
});
// 5,8s: đống bao rung nhẹ; dấu hỏi đen hiện trên đầu Ông Sơn
tl.to(pile, { keyframes: { x: [-6, 6, -5, 4, -2, 0], easeEach: "sine.inOut" }, duration: 0.6 }, 5.8);
vk.pop(tl, "#c1d2-hoi", 5.8, { scale0: 0.4, dur: 0.5 });
tl.to("#c1d2-hoi", { rotation: 10, duration: 0.4, ease: "sine.inOut" }, 6.4).to("#c1d2-hoi", { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 6.81);
// 9,4s: đống bao tách thành ba cụm (bao 0,4,7 | 1,2,5 | 6,3,8), thu nhỏ, chuẩn bị cho đoạn sau
const CX = [780, 1015, 1250], GY = 840;
const CUM = [ // [chỉ số bao, dx, dy] trong từng cụm
  [[0, -34, 0], [4, 34, 0], [7, 0, -84]],
  [[1, -34, 0], [2, 34, 0], [5, 0, -84]],
  [[6, -34, 0], [3, 34, 0], [8, 0, -84]],
];
CUM.forEach((c, k) => c.forEach(([i, dx, dy]) => {
  tl.to(BAO[i], { x: CX[k] + dx - 120, y: GY + dy - 120, scale: 0.66, rotation: ROT[i] * 0.5, duration: 0.9, ease: "power2.inOut" }, 9.4);
}));
tl.to("#c1d2-hoi", { opacity: 0, duration: 0.4, ease: "power2.in" }, 9.4);
window.__timelines["c1-d2"] = tl;
</script>
