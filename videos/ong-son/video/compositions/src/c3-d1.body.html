<style>
/*VK_FONT*/
/*VK_CSS*/
#root { position: absolute; inset: 0; overflow: hidden; }
.c3d1-troi { position: absolute; left: 0; top: 0; width: 1920px; height: 400px; background: linear-gradient(180deg, #9BD0F2 0%, #BFE3F8 100%); }
.c3d1-nen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.c3d1-bien { position: absolute; left: 890px; top: 52px; width: 580px; height: 150px; display: flex; align-items: center; justify-content: center; font: 800 80px/1 'Be Vietnam Pro', sans-serif; color: var(--muc); letter-spacing: -0.5px; white-space: nowrap; }
.c3d1-xe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.c3d1-xe img { position: absolute; }
.c3d1-bongxe { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(17,17,19,0.28) 0%, rgba(17,17,19,0) 70%); }
.c3d1-hang { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; filter: drop-shadow(0 6px 8px rgba(17,17,19,0.25)); }
.c3d1-veil { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #F8F7F4; }
.c3d1-o { position: absolute; width: 270px; height: 150px; background: var(--be-mat); border: var(--vien); border-radius: var(--ban-kinh); box-shadow: var(--bong-nho); }
.c3d1-o img { position: absolute; left: 85px; top: 20px; width: 110px; height: 110px; }
.c3d1-the { position: absolute; left: 810px; top: 430px; width: 300px; height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.c3d1-so { font: 800 130px/1 'Be Vietnam Pro', sans-serif; color: var(--muc); letter-spacing: -2px; }
.c3d1-nhan { font: 700 40px/1.2 'Be Vietnam Pro', sans-serif; color: var(--muc-phu); }
</style>
<div data-hf-id="hf-ys6b" id="root" data-composition-id="c3-d1" data-width="1920" data-height="1080">
  <div data-hf-id="hf-fdzi" class="c3d1-troi"></div>
  <img data-hf-id="hf-6fjl" class="c3d1-nen" id="c3d1-nen" src="assets/images/nen/ngoai-that-tiem.png" alt="">
  <div data-hf-id="hf-ek3h" class="c3d1-bien" id="c3d1-bien">Tạp hoá Sơn</div>
  <div data-hf-id="hf-plss" class="c3d1-xe" id="c3d1-xe"></div>
  <div data-hf-id="hf-lt53" id="c3d1-hang"></div>
  <div data-hf-id="hf-j58u" class="c3d1-veil" id="c3d1-veil"></div>
  <div data-hf-id="hf-8fia" id="c3d1-luoi"></div>
  <div data-hf-id="hf-wc4b" class="vk-the c3d1-the" id="c3d1-the"><div data-hf-id="hf-fqfg" class="c3d1-so" id="c3d1-so">6</div><div data-hf-id="hf-zblc" class="c3d1-nhan">mặt hàng</div></div>
</div>
<script>
/*VK_JS*/
const D = 11.56;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");

// ---- hàm phụ: bay theo cung, chỉ hiện nhanh ở lúc bắt đầu bay (cung của vk.cung làm mờ->rõ suốt chuyến bay)
function bay(el, o) {
  const cao = o.cao ?? -170, ymid = Math.min(o.y0, o.y1) + cao;
  tl.fromTo(el, { x: o.x0, y: o.y0, rotation: o.r0 ?? 0, scale: o.s0 ?? 1 },
    { x: o.x1, rotation: 0, scale: o.s1 ?? 1, duration: o.dur, ease: "power1.inOut" }, o.t);
  tl.to(el, { keyframes: { y: [ymid, o.y1], easeEach: "sine.inOut" }, duration: o.dur }, o.t);
  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, o.t);
}

// ---- 0,3s: biển "Tạp hoá Sơn" hiện (nền ngoại thất có sẵn từ lúc cắt vào)
vk.vao(tl, "#c3d1-bien", 0.3, { dy: 22, dur: 0.6 });

// ---- 5,0s: xe tải vào từ trái (xe quay đầu sang phải, hướng về tiệm)
const XE = 640, xeTop = 1040 - 0.85 * XE, xeLeft = 30;
const xe = document.getElementById("c3d1-xe");
const bongXe = document.createElement("div");
bongXe.className = "c3d1-bongxe";
bongXe.style.cssText = `left:${xeLeft + 60}px; top:${1040 - 28}px; width:${XE * 0.9}px; height:60px;`;
const xeImg = document.createElement("img");
xeImg.src = "assets/images/vat/xe-tai.png"; xeImg.alt = "";
xeImg.style.cssText = `left:${xeLeft}px; top:${xeTop}px; width:${XE}px; height:${XE}px; filter: drop-shadow(0 8px 12px rgba(17,17,19,0.22));`;
xe.appendChild(bongXe); xe.appendChild(xeImg);
tl.fromTo(xe, { x: -820 }, { x: 0, duration: 0.6, ease: "power3.out" }, 4.85);

// ---- thùng nước mắm, bao muối, gói mì chính bay theo cung từ thùng xe xuống đất trước tiệm
const hangBox = document.getElementById("c3d1-hang");
const bedX = xeLeft + 0.27 * XE, bedY = xeTop + 0.47 * XE;     // đáy thùng xe
const SAN = 1038;                                              // mặt đất trước tiệm (đáy nhìn thấy của hàng)
const HANG = [
  { src: "thung-nuoc-mam", size: 310, cx: 930, bot: 0.95, t: 5.3 },
  { src: "bao-muoi", size: 270, cx: 1175, bot: 0.97, t: 6.15 },
  { src: "goi-mi-chinh", size: 250, cx: 1400, bot: 0.94, t: 6.8 },
];
HANG.forEach((h, i) => {
  const img = document.createElement("img");
  img.className = "c3d1-hang"; img.src = `assets/images/vat/${h.src}.png`; img.alt = ""; img.id = "c3d1-h" + i;
  img.style.width = img.style.height = h.size + "px";
  hangBox.appendChild(img);
  const bong = document.createElement("div");
  bong.className = "c3d1-bongxe";
  bong.style.cssText = `left:${h.cx - h.size * 0.4}px; top:${SAN - 14}px; width:${h.size * 0.8}px; height:30px;`;
  hangBox.insertBefore(bong, img);
  const y1 = SAN + (1 - h.bot) * h.size - h.size;
  bay(img, { x0: bedX - h.size / 2, y0: bedY - h.size + (1 - h.bot) * h.size, x1: h.cx - h.size / 2, y1, s0: 0.5, r0: -16, dur: 0.85, t: h.t, cao: -190 });
  const tHit = h.t + 0.85;
  tl.fromTo(bong, { opacity: 0 }, { opacity: 1, duration: 0.2 }, tHit - 0.1);
  vk.nay(tl, img, tHit, { m: 1.06 });
});

// ---- lưới 20 ô (sẽ dùng lại ở đoạn sau): kích thước và vị trí giống hệt c3-d2
const LOAI = ["bao-gao", "bao-muoi", "goi-mi-chinh", "chai-nuoc-mam", "thung-nuoc-mam", "thung-gao"];
const luoi = document.getElementById("c3d1-luoi");
const GL = 261, GT = 200, CW = 270, CH = 150, GAP = 12;
const o20 = [];
for (let i = 0; i < 20; i++) {
  const c = document.createElement("div");
  c.className = "c3d1-o";
  const col = i % 5, row = Math.floor(i / 5);
  c.style.left = GL + col * (CW + GAP) + "px"; c.style.top = GT + row * (CH + GAP) + "px";
  const im = document.createElement("img");
  im.src = `assets/images/vat/${LOAI[i % LOAI.length]}.png`; im.alt = "";
  c.appendChild(im); luoi.appendChild(c); o20.push(c);
}

// ---- 8,4s: số "6" hiện giữa khung
vk.pop(tl, "#c3d1-the", 8.3, { scale0: 0.6, dur: 0.5 });

// ---- 9,4s: 6 -> 10 ; 10,3s: 10 -> 20, ô hàng nhân lên thành lưới mờ phía sau
const soEl = document.getElementById("c3d1-so"), p = { v: 6 };
const ghi = () => { soEl.textContent = String(Math.round(p.v)); };
tl.to(p, { v: 10, duration: 0.45, ease: "none", onUpdate: ghi }, 9.4);
tl.to("#c3d1-the", { scale: 1.12, duration: 0.45, ease: "power2.out" }, 9.4);
tl.to(p, { v: 20, duration: 0.8, ease: "power2.out", onUpdate: ghi }, 10.3);
tl.to("#c3d1-the", { scale: 1.4, duration: 0.8, ease: "power2.out" }, 10.3);
// nền tối đi và lưới ô tách ra từ chỗ ba món hàng
tl.fromTo("#c3d1-veil", { opacity: 0 }, { opacity: 0.85, duration: 0.5, ease: "power2.out" }, 10.25);
const goc = [930, 1175, 1400];
o20.forEach((c, i) => {
  const col = i % 5, row = Math.floor(i / 5);
  const cx = GL + col * (CW + GAP) + CW / 2, cy = GT + row * (CH + GAP) + CH / 2;
  const g = goc[i % 3];
  tl.fromTo(c, { opacity: 0, x: g - cx, y: 900 - cy, scale: 0.3 }, { opacity: 0.55, x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 10.3 + i * 0.03);
});
const ke = vk.keGach(tl, root, { co: 2 });
ke.style.zIndex = "30";
window.__timelines["c3-d1"] = tl;
</script>
