<script>
/*VK_JS*/
const D = 22.25;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
const S = 'fill="none" stroke="#111113" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
  quay: `<svg viewBox="0 0 64 64"><rect x="6" y="38" width="52" height="20" rx="3" ${S}/><rect x="16" y="14" width="26" height="18" rx="3" ${S}/><path d="M22 22h14M42 44h10" ${S}/></svg>`,
  kho: `<svg viewBox="0 0 64 64"><path d="M5 26 32 8l27 18" ${S}/><rect x="9" y="26" width="46" height="30" ${S}/><rect x="20" y="38" width="24" height="18" ${S}/><path d="M32 38v18" ${S}/></svg>`,
  ketoan: `<svg viewBox="0 0 64 64"><rect x="12" y="6" width="40" height="52" rx="5" ${S}/><rect x="19" y="13" width="26" height="11" ${S}/><path d="M21 34h4M30 34h4M39 34h4M21 43h4M30 43h4M39 43h4M21 51h4M30 51h4M39 51h4" ${S}/></svg>`,
  luat: `<svg viewBox="0 0 64 64"><path d="M14 5h30l10 10v44H14z" ${S}/><path d="M44 5v10h10" ${S}/><path d="M24 44l16-16" ${S}/><circle cx="26" cy="31" r="3.5" ${S}/><circle cx="38" cy="42" r="3.5" ${S}/></svg>`,
  cafe: `<svg viewBox="0 0 64 64"><path d="M10 22h34v18a14 14 0 0 1-14 14h-6a14 14 0 0 1-14-14z" ${S}/><path d="M44 28h6a7 7 0 0 1 0 14h-8" ${S}/><path d="M20 8v8M28 8v8M36 8v8" ${S}/></svg>`,
  thuoc: `<svg viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="9" ${S}/><path d="M32 19v26M19 32h26" ${S}/></svg>`,
  ao: `<svg viewBox="0 0 64 64"><path d="M22 8l-16 10 7 11 7-4v30h24V25l7 4 7-11L42 8c-2 6-6 9-10 9s-8-3-10-9z" ${S}/></svg>`,
};
const TICK = '<svg class="c5d4-tick" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21" fill="#22C55E" stroke="#111113" stroke-width="2.5"/><path d="M12 23 L19 30 L32 14" fill="none" stroke="#111113" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

vk.keGach(tl, root, { co: 5 });

// Ông Sơn đứng trước tiệm (bên trái)
const son = vk.nv(root, { src: "assets/images/ong-son/goc.png", size: 620, cx: 340, base: 1058, id: "c5d4-son" });

// thẻ bên trong tiệm (bốn thứ giữ nguyên)
const cards = [
  { k: "quay", t: "quầy thu ngân", x: 720 }, { k: "kho", t: "kho", x: 984 },
  { k: "ketoan", t: "đội kế toán", x: 1248 }, { k: "luat", t: "luật giảm giá", x: 1512 },
];
cards.forEach((c, i) => {
  const d = document.createElement("div");
  d.className = "vk-the th-vat c5d4-card"; d.id = "c5d4-c" + i;
  d.style.left = c.x + "px";
  d.innerHTML = ICON[c.k] + "<span>" + c.t + "</span>";
  const tk = document.createElement("div");
  tk.style.cssText = "position:absolute;right:-12px;top:-14px;width:44px;height:44px";
  tk.id = "c5d4-tk" + i; tk.innerHTML = TICK; tk.firstChild.style.cssText = "left:0;top:0;width:44px;height:44px";
  d.appendChild(tk);
  root.appendChild(d);
});
// ba cửa hàng khác (cuối đoạn)
const shops = [{ k: "cafe", t: "cà phê", x: 843 }, { k: "thuoc", t: "hiệu thuốc", x: 1115 }, { k: "ao", t: "quần áo", x: 1387 }];
shops.forEach((c, i) => {
  const d = document.createElement("div");
  d.className = "vk-the th-vat c5d4-shop"; d.id = "c5d4-s" + i;
  d.style.left = c.x + "px";
  d.innerHTML = ICON[c.k] + "<span>" + c.t + "</span>";
  root.appendChild(d);
});
// hàng hoá: thùng gạo -> nồi nước dùng + rổ bún
const thung = vk.nv(root, { src: "assets/images/vat/thung-gao.png", size: 270, cx: 1240, base: 772, bong: false, id: "c5d4-thung" });
const noi = vk.nv(root, { src: "assets/images/vat/noi-nuoc-dung.png", size: 270, cx: 1040, base: 772, bong: false, id: "c5d4-noi" });
const ro = vk.nv(root, { src: "assets/images/vat/ro-bun.png", size: 270, cx: 1440, base: 772, bong: false, id: "c5d4-ro" });
// biển nằm trên cùng
root.appendChild(document.getElementById("c5d4-b1"));
root.appendChild(document.getElementById("c5d4-b2"));
// các thẻ nhỏ cuối đoạn được thêm sau chip, giữ thứ tự hiển thị
root.appendChild(document.getElementById("c5d4-chip").parentNode);

// 0,4s: biển "Tạp hoá Sơn" (chữ HTML trên biển trống); 0,5s: Ông Sơn đứng trước tiệm
vk.vao(tl, "#c5d4-b1", 0.35, { dy: 12, dur: 0.5 });
tl.fromTo([son, son._bong], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.5);
// 4,4s: dấu hỏi to; 5,2s: hình "phá đi, xây lại"; búa đập; dấu X đỏ chéo lên
vk.pop(tl, "#c5d4-hoi", 4.4, { scale0: 0.4, dur: 0.6 });
tl.to("#c5d4-hoi", { rotation: 5, duration: 0.3, ease: "sine.inOut" }, 5.0).to("#c5d4-hoi", { rotation: -4, duration: 0.4, ease: "sine.inOut" }, 5.3);
vk.vao(tl, "#c5d4-pha", 5.2, { dy: 24, dur: 0.5 });
vk.vao(tl, "#c5d4-pha-cap", 5.4, { dy: 16, dur: 0.45 });
tl.fromTo("#c5d4-bua", { rotation: -55, svgOrigin: "500 50" }, { rotation: 42, svgOrigin: "500 50", duration: 0.4, ease: "power2.in" }, 5.65);
tl.to("#c5d4-bua", { rotation: 18, svgOrigin: "500 50", duration: 0.25, ease: "power2.out" }, 6.08);
tl.to("#c5d4-nha", { keyframes: { x: [7, -6, 0], easeEach: "none" }, duration: 0.28 }, 6.05);
tl.fromTo("#c5d4-nut", { opacity: 0, strokeDasharray: 1, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.25, ease: "power1.out" }, 6.05);
tl.fromTo("#c5d4-x1", { opacity: 0, strokeDasharray: 1, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.35, ease: "power1.inOut" }, 6.3);
tl.fromTo("#c5d4-x2", { opacity: 0, strokeDasharray: 1, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.35, ease: "power1.inOut" }, 6.6);
// 6,9s: dấu hỏi và hình đập phá mờ đi
tl.to(["#c5d4-hoi", "#c5d4-pha", "#c5d4-pha-cap"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 6.85);
// 7,1s: cắt nhẹ để lộ bên trong tiệm (nền mờ đi); quầy thu ngân sáng, dấu tích xanh
tl.fromTo("#c5d4-veil", { opacity: 0 }, { opacity: 0.94, duration: 0.6, ease: "power2.out" }, 7.1);
const bat = (i, t) => {
  vk.vao(tl, "#c5d4-c" + i, t, { dy: 22, dur: 0.45 });
  vk.pop(tl, "#c5d4-tk" + i, t + 0.4, { scale0: 0.3, dur: 0.4 });
  tl.to("#c5d4-c" + i, { borderColor: "#22C55E", duration: 0.3, ease: "power2.out" }, t + 0.4);
};
bat(0, 7.3);
// 9,7s: kho, rồi đội kế toán; 11,0s: luật giảm giá
bat(1, 9.7);
bat(2, 10.3);
bat(3, 11.0);
// 13,0s: khung viền cam bao bốn thứ
tl.fromTo("#c5d4-khung", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 13.0);
vk.pop(tl, "#c5d4-khung-nhan", 13.25, { scale0: 0.8, dur: 0.45 });
// 13,9s: thùng gạo (hàng hiện tại)
vk.vao(tl, thung, 13.7, { dy: 20, dur: 0.45 });
// 14,5s: biển lật thành "Bún Sơn"; thùng gạo bay ra, nồi nước dùng và rổ bún bay vào
tl.fromTo("#c5d4-b1", { rotationX: 0, opacity: 1, transformPerspective: 700, transformOrigin: "50% 50%" }, { rotationX: -90, opacity: 0, duration: 0.3, ease: "power2.in" }, 14.5);
tl.fromTo("#c5d4-b2", { rotationX: 90, opacity: 0, transformPerspective: 700, transformOrigin: "50% 50%" }, { rotationX: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 14.8);
tl.to(thung, { x: 1000, rotation: 20, opacity: 0, duration: 0.8, ease: "power2.in" }, 14.5);
tl.to(thung, { keyframes: { y: [-30, 160], easeEach: "sine.inOut" }, duration: 0.8 }, 14.5);
tl.set(thung, { opacity: 0 }, 15.4);
vk.cung(tl, noi, { x0: 1000, y0: 220, x1: 0, y1: 0, r0: 24, t: 14.95, dur: 0.9, cao: -120, hien0: false });
vk.nay(tl, noi, 15.85, { m: 1.06 });
vk.cung(tl, ro, { x0: 1000, y0: 220, x1: 0, y1: 0, r0: 24, t: 15.35, dur: 0.9, cao: -120, hien0: false });
vk.nay(tl, ro, 16.25, { m: 1.06 });
// 19,6s: chip dùng lại cho mọi cửa hàng; ba cửa hàng khác cùng dùng bộ khung
vk.vao(tl, "#c5d4-chip", 19.6, { dy: 20, dur: 0.5 });
vk.vao(tl, "#c5d4-s0", 20.1, { dy: 24, dur: 0.5 });
vk.vao(tl, "#c5d4-s1", 20.4, { dy: 24, dur: 0.5 });
vk.vao(tl, "#c5d4-s2", 20.7, { dy: 24, dur: 0.5 });
window.__timelines["c5-d4"] = tl;
</script>
