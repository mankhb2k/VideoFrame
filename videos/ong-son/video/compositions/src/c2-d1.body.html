<script>
/*VK_JS*/
const D = 14.89;
const tl = gsap.timeline({ paused: true });
const root = document.getElementById("root");
// kệ gạch: 1 viên có sẵn (BIẾN)
vk.keGach(tl, root, { co: 1 });
const son = vk.nv(root, { src: "assets/images/ong-son/ban-ron.png", size: 700, cx: 720, base: 1060, id: "c2d1-son" });
son.style.zIndex = 5;

// 0,3s / 1,0s / 1,7s: ba bóng khách lần lượt vào từ phải
["#c2d1-k1", "#c2d1-k2", "#c2d1-k3"].forEach((s, i) => {
  tl.fromTo(s, { x: 600, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.3 + i * 0.7);
});

// 2,4s: ba biểu tượng bật lên lần lượt rồi quay quanh ông, chậm tới nhanh (7,3s dừng)
const O = { cx: 720, cy: 640, rx: 400, ry: 230 };
const A0 = [200, 320, 80]; // góc đầu (độ) của máy tính tiền, bao gạo, kho: rải đều quanh ông
const ics = ["#c2d1-i0", "#c2d1-i1", "#c2d1-i2"].map((s) => document.querySelector(s));
const place = (i, a) => {
  const r = a * Math.PI / 180;
  return { x: O.cx + O.rx * Math.cos(r) - 115, y: O.cy + O.ry * Math.sin(r) - 90, z: Math.sin(r) > 0 ? 8 : 2 };
};
const ang = { v: 0 };
const apply = () => ics.forEach((el, i) => { const p = place(i, A0[i] + ang.v); gsap.set(el, { x: p.x, y: p.y }); el.style.zIndex = p.z; });
apply();
ics.forEach((el, i) => vk.pop(tl, el, 2.4 + i * 0.5, { scale0: 0.4, dur: 0.5 }));
tl.fromTo(ang, { v: 0 }, { v: 600, duration: 3.8, ease: "power2.in", onUpdate: apply }, 2.4);
tl.fromTo(ang, { v: 600 }, { v: 760, duration: 1.1, ease: "power2.out", onUpdate: apply, immediateRender: false }, 6.2);

// 7,3s: chỉ còn máy tính tiền sáng, hai cái kia mờ xuống 30%; máy tính tiền bay sang phải
tl.to([ics[1], ics[2]], { opacity: 0.3, duration: 0.4, ease: "power2.out" }, 7.2);
const pm = place(0, A0[0] + 760);
tl.fromTo(ics[0], { x: pm.x, y: pm.y, scale: 1 }, { x: 1440 - 115, y: 250 - 90, scale: 1.15, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 7.4);
// 10,7s: phép tính "giá × số ký" cạnh máy tính, chữ 80 px
vk.pop(tl, "#c2d1-pt", 10.7, { scale0: 0.8, dur: 0.55 });
// 13,7s: "50 lần / ngày" đếm từ 1 lên 50, số phóng to dần
tl.fromTo("#c2d1-demw", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 13.55);
tl.fromTo("#c2d1-dem", { scale: 0.6 }, { scale: 1.0, duration: 1.0, ease: "power2.in" }, 13.55);
vk.dem(tl, "#c2d1-so", { tu: 1, den: 50, t: 13.65, dur: 0.9, ease: "power1.in" });
window.__timelines["c2-d1"] = tl;
</script>
