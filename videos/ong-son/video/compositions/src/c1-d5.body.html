const D = 20.4;
const tl = gsap.timeline({ paused: true });

tl.fromTo("#c1d5-lich", { opacity: 0, rotationX: -90, transformPerspective: 900, transformOrigin: "50% 0%" }, { opacity: 1, rotationX: 0, duration: 0.7, ease: "back.out(1.5)" }, 5.4);
tl.fromTo(binh, { x: 520, opacity: 1 }, { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 5.4);
tl.fromTo(binh._bong, { x: 520, opacity: 1 }, { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 5.4);
// 9,1s: dấu hỏi bật ra cạnh a, rồi b, rồi c

vk.pop(tl, "#c1d5-hb", 10.3, { scale0: 0.3, dur: 0.55 });
vk.pop(tl, "#c1d5-hc", 11.5, { scale0: 0.3, dur: 0.55 });

  .to(binh, { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 14.4);

tl.fromTo(son._bong, { opacity: 0 }, { opacity: 1, duration: 0.6 }, 13.3);
