            <svg data-hf-id="hf-xex4" viewBox="0 0 70 64"><path data-hf-id="hf-hs4u" d="M35 6 L65 58 H5 Z" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linejoin="round" /><path data-hf-id="hf-s73h" d="M35 24 V40" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" /><circle data-hf-id="hf-vv8a" cx="35" cy="49" r="3.5" fill="#E2E8F0" /></svg>
            <div data-hf-id="hf-dp39" class="s6-warn-t">Protocol lạm dụng = một mớ rối khác</div>
          </div>

          <!-- phase 3: rules of thumb -->
          <div data-hf-id="hf-yfmq" class="s6-h3" id="s6-h3">Quy tắc ngón tay cái</div>
          <div data-hf-id="hf-piw8" class="s6-h3line" id="s6-h3line"></div>
          <div data-hf-id="hf-x2oy" class="s6-rule" id="s6-rule1" style="top:262px"><div data-hf-id="hf-daqj" class="s6-rn">1</div><div data-hf-id="hf-cqie" class="s6-rm">Quan hệ “là một” → <span data-hf-id="hf-vwu1">kế thừa</span></div><div data-hf-id="hf-zf1x" class="s6-rs">Thật sự, ổn định, tối đa 2 tầng</div></div>
          <div data-hf-id="hf-kgla" class="s6-rule" id="s6-rule2" style="top:470px"><div data-hf-id="hf-cwfi" class="s6-rn">2</div><div data-hf-id="hf-lfh0" class="s6-rm">Chỉ chia sẻ khả năng → <span data-hf-id="hf-3vf0">interface</span></div><div data-hf-id="hf-7kt1" class="s6-rs">Hoặc một hàm riêng</div></div>
          <div data-hf-id="hf-c3y9" class="s6-rule" id="s6-rule3" style="top:678px"><div data-hf-id="hf-ci4h" class="s6-rn">3</div><div data-hf-id="hf-i0iz" class="s6-rm">Chưa có hai nơi cần → <span data-hf-id="hf-83uz">đừng tạo sớm</span></div><div data-hf-id="hf-2y5q" class="s6-rs">Đừng tạo interface khi chưa cần</div></div>
        </div>
      </div>
      <script>
        (function () {
          var root = document.querySelector('[data-composition-id="scene-6"]');
          var $ = function (s) { return root.querySelector(s); };
          var $$ = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });
          window.__timelines["scene-6"] = tl;
          var DUR = 63.5;

          function hide(els) { tl.set(els, { opacity: 0 }, 0); }
          function arrive(el, t, dy, d) {
            tl.set(el, { opacity: 1, y: dy }, t);
            tl.to(el, { y: 0, duration: d || 0.4, ease: "power4.out" }, t);
          }
          function pop(el, t, d, ov) {
            tl.fromTo(el, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: d || 0.5, ease: "back.out(" + (ov || 2) + ")" }, t);
          }
          function prep(el) {
            var L = el.getTotalLength ? Math.ceil(el.getTotalLength()) + 2 : 400;
            el.style.strokeDasharray = L;
            el.style.strokeDashoffset = L;
            return L;
          }
          function drawAll(sel, t, d, gap) {
            $$(sel).forEach(function (el, i) {
              var L = prep(el);
              tl.fromTo(el, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t + i * gap);
            });
          }
          function drawOne(el, t, d) {
            var L = prep(el);
            tl.fromTo(el, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
          }
          // finite, explicit oscillation (no yoyo/repeat): n cycles of `period`
          function osc(el, prop, amt, t0, period, n, ease) {
            for (var i = 0; i < n; i++) {
              var a = {}, b = {};
              a[prop] = amt; a.duration = period / 2; a.ease = ease || "sine.inOut";
              b[prop] = 0; b.duration = period / 2; b.ease = ease || "sine.inOut";
              tl.to(el, a, t0 + i * period);
              tl.to(el, b, t0 + i * period + period / 2);
            }
          }

          var stage = $(".s6-stage");
          tl.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
          tl.fromTo(stage, { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false }, DUR - 0.4);
          tl.set($(".s6-glow-a"), { opacity: 0 }, 0);

          /* ---------- PHASE 1: four reasons ---------- */
          var title = $("#s6-title"); hide(title); arrive(title, 0.25, 60, 0.4);

          var cards = [1, 2, 3, 4].map(function (i) { return $("#s6-card" + i); });
          hide(cards);
          cards.forEach(function (c, i) { arrive(c, 2.76 + i * 0.1, 80, 0.4); });

          var lbls = $$(".s6-lbl"), tags = $$(".s6-tag");
          hide(lbls); hide(tags);
          // hide icon fills / pieces that are revealed later
          var act = [3.6, 13.15, 20.1, 27.88];   // "Một" ~3.72, "Hai" ~13.24, "Ba" 20.22, "Bốn" 27.98
          var lblT = [4.45, 13.95, 20.9, 28.65]; // "Mở rộng" 4.58, "Dễ test" 14.08, "Nhiều nhóm" 21.0, "Đổi công nghệ" 28.74
          var tagT = [9.28, 15.2, 22.75, 30.25];  // "Open Closed" 9.38, "thay một protocol bằng bản giả" 15.3, "hợp đồng" 22.86, "chỉ phụ thuộc vào giao diện" 30.36
          cards.forEach(function (c, i) {
            var t = act[i];
            tl.to(c, { borderColor: "#10B981", duration: 0.3 }, t);
            tl.to(c.querySelector(".s6-num"), { backgroundColor: "#10B981", color: "#052E21", duration: 0.3 }, t);
            arrive(lbls[i], lblT[i], 30, 0.4);
            arrive(tags[i], tagT[i], 30, 0.4);
          });
          // tag 1 swaps to Open/Closed explanation
          hide([$("#s6-tag1b"), $("#s6-tag1c")]);
          tl.to($("#s6-tag1a"), { opacity: 0, duration: 0.2 }, 10.35);
          arrive($("#s6-tag1b"), 10.42, 24, 0.4);   // "Mở cho việc mở rộng" 10.52
          arrive($("#s6-tag1c"), 11.95, 24, 0.4);   // "đóng với việc sửa đổi" 12.06

          // icon 1: expand sideways (draw, then enrichment)
          drawAll(".s6-d1", 3.6, 0.55, 0.28);
          tl.to($("#s6-f1c"), { fillOpacity: 0.28, duration: 0.4 }, 4.4);
          tl.to([$("#s6-f1l"), $("#s6-f1r")], { fillOpacity: 0.28, duration: 0.4 }, 5.3);
          osc($("#s6-a1l"), "x", -12, 5.8, 1.1, 5);
          osc($("#s6-a1r"), "x", 12, 5.8, 1.1, 5);

          // icon 2: lock + test tube, check lands when the fake replaces the real one
          drawAll(".s6-d2", 13.15, 0.5, 0.26);
          tl.to($("#s6-f2"), { fillOpacity: 0.28, duration: 0.4 }, 14.2);
          tl.set($("#s6-shackle"), { y: -14 }, 0);
          tl.to($("#s6-shackle"), { y: 0, duration: 0.25, ease: "power2.in" }, 16.4);   // "bản giả" 16.68
          drawOne($("#s6-check"), 16.55, 0.4);
          tl.to($("#s6-f2"), { fillOpacity: 0.5, duration: 0.3 }, 16.8);

          // icon 3: two groups joined through a socket, a signal passes through the contract
          drawAll(".s6-d3", 20.1, 0.45, 0.12);
          var spark = $("#s6-spark");
          for (var k = 0; k < 5; k++) {
            var t0 = 22.3 + k * 1.3;   // "Protocol là hợp đồng" 22.2
            tl.fromTo(spark, { x: 0, opacity: 0 }, { x: 104, opacity: 1, duration: 1.0, ease: "power1.inOut" }, t0);
            tl.to(spark, { opacity: 0, duration: 0.15 }, t0 + 1.0);
          }
          tl.to($("#s6-socket"), { fill: "rgba(16,185,129,0.4)", duration: 0.4 }, 22.75);
          tl.to($("#s6-socket"), { scale: 1.14, svgOrigin: "143 120", duration: 0.25, ease: "power2.out" }, 25.0);
          tl.to($("#s6-socket"), { scale: 1, svgOrigin: "143 120", duration: 0.4, ease: "back.out(2.5)" }, 25.25);

          // icon 4: technology switch
          drawAll(".s6-d4", 27.88, 0.5, 0.22);
          pop($("#s6-knob"), 28.85, 0.4, 2.5);
          tl.to($("#s6-knob"), { x: 96, duration: 0.5, ease: "back.out(1.6)" }, 29.15);   // "dễ hơn" 29.02
          tl.to($("#s6-track"), { fill: "rgba(16,185,129,0.45)", duration: 0.4 }, 29.25);
          tl.to($("#s6-f4r"), { fillOpacity: 0.4, duration: 0.4 }, 29.35);
          tl.to($("#s6-sq-l"), { opacity: 0.3, duration: 0.4 }, 29.35);
          tl.to($("#s6-knob"), { x: 0, duration: 0.5, ease: "back.out(1.6)" }, 32.4);   // "thứ cụ thể" 32.48
          tl.to($("#s6-track"), { fill: "rgba(16,185,129,0)", duration: 0.4 }, 32.5);
          tl.to($("#s6-f4r"), { fillOpacity: 0, duration: 0.4 }, 32.5);
          tl.to($("#s6-sq-l"), { opacity: 1, duration: 0.4 }, 32.5);
          tl.to($("#s6-sq-r"), { opacity: 0.3, duration: 0.4 }, 32.5);

          /* ---------- PHASE 2: when OOP is still fine (35.4 - 51) ---------- */
          tl.to([title].concat(lbls, tags), { opacity: 0, duration: 0.25, ease: "power1.in" }, 33.85);
          tl.to($(".s6-glow-g"), { opacity: 0, duration: 0.8 }, 34.1);
          tl.to($(".s6-glow-a"), { opacity: 1, duration: 0.8 }, 34.1);
          tl.to($("#s6-cards"), { scale: 0.3, x: 67.2, y: 43.2, duration: 0.8, ease: "power3.inOut" }, 34.1);

          var h2 = $("#s6-h2"), h2l = $("#s6-h2line"), oc = $("#s6-oopcard");
          var chip1 = $("#s6-chip1"), chip2 = $("#s6-chip2");
          var t1 = $("#s6-tile1"), t2 = $("#s6-tile2"), warn = $("#s6-warn");
          hide([h2, oc, chip1, chip2, t1, t2, warn]);
          tl.set(h2l, { opacity: 0 }, 0);
          arrive(h2, 34.35, 60, 0.4);   // "đừng vội vứt OOP" 34.46
          tl.fromTo(h2l, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 34.7);
          arrive(oc, 34.6, 40, 0.5);
          arrive(chip1, 37.25, 40, 0.4);   // "quan hệ là một" 37.36
          arrive(chip2, 38.4, 40, 0.4);   // "cây chỉ sâu 1-2 tầng" 38.48

          function tile(el, t) {
            arrive(el, t, 50, 0.45);
            var nodes = Array.prototype.slice.call(el.querySelectorAll(".s6-node"));
            nodes.forEach(function (n, i) {
              tl.fromTo(n, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, t + 0.3 + i * 0.12);
            });
            var edges = Array.prototype.slice.call(el.querySelectorAll(".s6-edge"));
            edges.forEach(function (e, i) { drawOne(e, t + 0.55 + i * 0.1, 0.45); });
          }
          tile(t1, 40.8);   // "lớp View" 40.88
          tile(t2, 42.85);   // "thực thể trong game engine" 42.96
          var ok1 = $("#s6-ok1"), ok2 = $("#s6-ok2");
          pop(ok1, 44.1, 0.5, 3); pop(ok2, 44.35, 0.5, 3);   // "Kế thừa vẫn hoạt động tốt" 44.22
          arrive(warn, 45.8, 40, 0.45);   // "protocol cũng có thể bị lạm dụng" 45.90
          tl.to(warn, { borderColor: "#E2E8F0", duration: 0.3 }, 49.9);   // "một mớ rối khác" 49.86
          tl.to(warn, { scale: 1.02, duration: 0.2, ease: "power2.out" }, 49.9);
          tl.to(warn, { scale: 1, duration: 0.45, ease: "back.out(2.5)" }, 50.1);

          /* ---------- PHASE 3: rules of thumb (50.9 - end) ---------- */
          var gone = [h2, h2l, oc, chip1, chip2, t1, t2, warn, $("#s6-cards")];
          tl.to(gone, { opacity: 0, duration: 0.3, ease: "power1.in" }, 50.6);

          var h3 = $("#s6-h3"), h3l = $("#s6-h3line");
          hide(h3); tl.set(h3l, { opacity: 0 }, 0);
          arrive(h3, 50.82, 60, 0.4);   // "Quy tắc ngón tay cái" 50.92
          tl.fromTo(h3l, { scaleX: 0, opacity: 1 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 51.2);

          var r1 = $("#s6-rule1"), r2 = $("#s6-rule2"), r3 = $("#s6-rule3");
          hide([r1, r2, r3]);
          // distinct slam per rule, each on its narration beat (kinetic-beat-slam)
          tl.fromTo(r1, { scale: 1.16, filter: "blur(14px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" }, 52.14);   // "Chỉ kế thừa khi" 52.24
          tl.fromTo(r2, { x: -520, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 56.58);   // "Chia sẻ một khả năng" 56.68
          tl.fromTo(r3, { y: 110, rotation: 3, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" }, 59.95);   // "Và chưa có 2 nơi" 60.06
        })();
      </script>
    </template>

</html>
