      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          tl.to(".s1-stage", { opacity: 0, duration: 0.4, ease: "power1.in" }, 44.6);

          }
          applyCam();
          tl.to(cam, { p: 1, duration: 10.5, ease: "power3.out", onUpdate: applyCam }, 0);

          // ---------- banana glow bloom, then hand-off to monkey ----------
          tl.fromTo(".s1-bglow", { opacity: 0, scale: 0.85 }, { opacity: 0.45, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
          var breathe = { p: 0 };
          tl.to(breathe, { p: Math.PI * 2 * 1.2, duration: 2.0, ease: "none", onUpdate: function () {
            Q(".s1-bglow").style.opacity = String(0.45 + Math.sin(breathe.p) * 0.04);
          } }, 1.2);
          tl.to(".s1-bglow", { opacity: 0, duration: 0.8, ease: "power1.in" }, 3.4);
          tl.fromTo(".s1-monkey", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 3.0);
          tl.to(".s1-banana", { opacity: 0, duration: 0.6, ease: "power1.out" }, 3.3);

          // ---------- path draw setup ----------
          var lens = {};
          QA(".s1-ln").forEach(function (p) {
            var len = p.getTotalLength();
            lens[p.id] = len;
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });
          function draw(id, t, d) {
            tl.fromTo("#" + id, { strokeDashoffset: lens[id], opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: d || 0.45, ease: "power2.out" }, t);
          }
          function pop(id, t) {
            tl.fromTo("#" + id, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, t);
          }

          // ---------- beat 1: chain of ancestors, anchored to cues ----------
          draw("s1-l-cha", 4.55); pop("s1-n-cha", 4.75);
          draw("s1-l-ong", 6.6);  pop("s1-n-ong", 6.85);
          draw("s1-l-cu", 8.9);  pop("s1-n-cu", 9.1);
          draw("s1-l-ky", 9.65);  pop("s1-n-ky", 9.85);
          draw("s1-l-to", 10.2); pop("s1-n-to", 10.4);

          // forest ("gia pha") from 12.62

            pop("s1-n-" + k, 12.62 + i * 0.1);

          ["lf1", "lf2", "lf3", "lf4", "lf5", "lf6", "lf7", "lf8"].forEach(function (k, i) {
            draw("s1-" + k, 12.7 + i * 0.1, 0.4);
          });
          ["r1", "r2", "r3", "r4", "r5", "r6", "r7"].forEach(function (k, i) {
            pop("s1-n-" + k, 13.5 + i * 0.1);
          });
          ["rf1", "rf2", "rf3", "rf4", "rf5", "rf6"].forEach(function (k, i) {
            draw("s1-" + k, 13.6 + i * 0.1, 0.4);
          });
          ["rs1", "rs2", "rs3", "rs4", "rs5", "rs6", "rs7"].forEach(function (k, i) {
            draw("s1-" + k, 14.4 + i * 0.08, 0.5);
          });

          // ---------- beat 2: Armstrong quote ----------
          tl.to(".s1-nodesL", { opacity: 0, duration: 0.8, ease: "power2.out" }, 15.4);
          tl.to(".s1-svgL", { opacity: 0.05, duration: 0.8, ease: "power2.out" }, 15.4);
          tl.fromTo("#s1-panel", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 15.76);
          tl.fromTo("#s1-aname", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 16.7);
          tl.fromTo("#s1-arole", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 17.5);
          // typewriter: whole words appear on their spoken time (discrete)
          QA(".s1-w").forEach(function (w) {
            tl.set(w, { opacity: 1 }, parseFloat(w.getAttribute("data-t")));

          // keyword glow (asr-keyword-glow, karaoke style) on "con khi" and "khu rung"
          var KW = { khi: [23.62, 24.65], rung: [25.62, 26.75] };
          var kwEls = QA(".s1-kw");
          var drv = { t: 23.2 };
          function env(t, s, e) {
            var A = 0.2, R = 0.5, REST = 0.9;
            if (t < s) return 0;
            if (t < e) return Math.min((t - s) / A, 1);
            if (t < e + R) return 1 - ((t - e) / R) * (1 - REST);
            return REST;
          }
          function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
          tl.to(drv, { t: 28.2, duration: 5, ease: "none", onUpdate: function () {
            kwEls.forEach(function (el) {
              var k = KW[el.getAttribute("data-kw")];
              var v = env(drv.t, k[0], k[1]);
              el.style.color = "rgb(" + lerp(226, 245, v) + "," + lerp(232, 158, v) + "," + lerp(240, 11, v) + ")";
              el.style.textShadow = "0 0 " + (30 * v) + "px rgba(245,158,11," + (0.7 * v) + ")";
              el.style.transform = "scale(" + (1 + 0.1 * v) + ")";

          // monkey ring on "con khi"

          tl.to(".s1-fr", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 25.95);

          // ---------- beat 3: OOP vs POP ----------

          tl.to(".s1-world", { opacity: 0, duration: 0.6, ease: "power2.in" }, 27.7);
          tl.fromTo("#s1-b3", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 27.9);
          tl.fromTo("#s1-head", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 28.9);
          tl.fromTo("#s1-cardL", { opacity: 0, x: -140 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 29.3);
          tl.fromTo("#s1-cardR", { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 29.3);
          tl.fromTo("#s1-vs", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 29.5);
          tl.fromTo("#s1-iconL", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 29.6);
          tl.fromTo("#s1-iconR", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 29.6);

          // OOP lights on "OOP" (33.33)
          tl.fromTo("#s1-wordL", { opacity: 0, x: -320 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 30.8);
          tl.to("#s1-cardL", { borderColor: "#F59E0B", duration: 0.5, ease: "power2.out" }, 30.8);
          tl.to("#s1-iconL", { color: "#F59E0B", duration: 0.5, ease: "power2.out" }, 30.8);
          tl.fromTo("#s1-glowL", { opacity: 0, scale: 0.8 }, { opacity: 0.4, scale: 1, duration: 1.0, ease: "power2.out" }, 30.8);
          tl.fromTo("#s1-chipL", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 32.4);

          // POP lights on "POP" (34.48)

          tl.to("#s1-iconR", { color: "#10B981", duration: 0.5, ease: "power2.out" }, 33.4);
