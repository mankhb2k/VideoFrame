      art: '<div class="s7-pop s7-bat" data-k="ba">' + battery(3) + '<span>readonly</span></div><div class="s7-pop s7-arrow" data-k="ar">→</div><div class="s7-pop s7-bat" data-k="bb">' + battery(2) + '<span>bản mới</span></div>',
      pops: [["ba", 67.4], ["ar", 68.9], ["bb", 69.1]] },
    { n: 7, title: "Để compiler bắt lỗi", t0: 74.8, tt: 75.55, err: "Property 'fly' is missing in type 'Eater'",
      lines: ["const penguin: Eater = {", '  eat: () => console.log("Ăn"),', "};", "release([penguin]);"],
      type: [[78.2, 79.3, 2], [79.4, 80.6, 3]], hl: [[81.4, 3]],
      art: '<div class="s7-pop s7-chr" data-k="chr">' + IMG("canh-cut") + '</div><div class="s7-pills"><span class="s7-pop s7-pill s7-red" data-k="p1">thiếu fly()</span></div>',
      chips: [{ k: "s", text: "strict: true", cls: "s7-g s7-m", t: 77.32 }],
      pops: [["chr", 78.4], ["p1", 82.0]] }
  ];

  // ---------- build DOM ----------
  var cardsEl = q(".s7-cards");
  RULES.forEach(function (R) {
    R.lines = R.lines.map(tok);
    R.len = R.lines.map(function (tk) { return tk.reduce(function (a, t) { return a + t[1].length; }, 0); });
    R.start = []; var acc = 0;
    R.len.forEach(function (l) { R.start.push(acc); acc += l + 1; });
    R.total = R.start[R.len.length - 1] + R.len[R.len.length - 1];
    R.px = { n: 0 };
    var words = R.title.split(" ").map(function (w) { return '<span class="s7-w">' + w + "</span>"; }).join("");
    var lnHtml = R.lines.map(function () { return '<div class="s7-ln"></div>'; }).join("");
    var chips = (R.chips || []).map(function (c) { return '<span class="s7-pop s7-chip ' + c.cls + '" data-k="' + c.k + '">' + c.text + "</span>"; }).join("");
    var err = R.err ? '<div class="s7-errrow"><i>✕</i><code>' + R.err + "</code></div>" : "";
    var tag = R.tag ? '<span class="s7-tag">' + R.tag + "</span>" : "";
    var d = document.createElement("div");
    d.className = "s7-card"; d.id = "s7-card-" + R.n;
    d.innerHTML = '<div class="s7-num">' + R.n + '</div><div class="s7-title">' + words + '</div><div class="s7-art">' + R.art + "</div>" +
      '<div class="s7-right"><div class="s7-group"><div class="s7-win' + (R.bad ? " s7-bad" : "") + '"><div class="s7-bar"><i></i><i></i><i></i><span class="s7-fname">luat-' + R.n + ".ts</span>" + tag + '</div><div class="s7-code">' + lnHtml + "</div>" + err + '</div><div class="s7-note">' + chips + "</div></div></div>";
    cardsEl.appendChild(d);
    R.el = d; R.lnEls = qa(".s7-ln", d); R.words = qa(".s7-title .s7-w", d); R.errEl = q(".s7-errrow", d);
  });

  var pipsEl = q(".s7-pips");
  var PIP_L = 1348, PIP_CY = 120, I_CY = 770;
  var pips = [];
  for (var i = 0; i < 7; i++) {
    var p = document.createElement("div"); p.className = "s7-pip"; p.textContent = String(i + 1); p.style.left = (PIP_L + i * 70) + "px";
    pipsEl.appendChild(p); pips.push(p);
  }
  var TITLES = RULES.map(function (r) { return r.title; });
  var checkEl = q(".s7-check");
  var rows = TITLES.map(function (t, i) {
    var d = document.createElement("div"); d.className = "s7-row";
    d.innerHTML = '<div class="s7-rn">' + (i + 1) + '</div><div class="s7-rt">' + t + '</div><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="4"/><path class="s7-ck" d="M18 33 L28 43 L47 22" pathLength="1" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:1 2;stroke-dashoffset:1;opacity:0"/></svg>';
    checkEl.appendChild(d); return d;
  });

  // subtitle words
  var subEl = q(".s7-i-sub");
  var subWords = "Nghĩ như POP, viết bằng TypeScript".split(" ").map(function (w) { return '<span class="s7-w">' + w + "</span>"; }).join("");
  subEl.innerHTML = subWords;

  // ---------- helpers ----------
  function waterfall(els, t, step, y) {
    els.forEach(function (el, i) {
      var at = t + i * step;
      tl.set(el, { opacity: 1, y: y }, at);
      tl.to(el, { y: 0, duration: 0.18, ease: "power4.out" }, at);
    });
  }
  function pop(el, t, y) {
    tl.fromTo(el, { opacity: 0, scale: 0.6, y: y == null ? 24 : y }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.7)", immediateRender: false }, t);
  }

  // ---------- stage fade ----------
  tl.fromTo(q(".s7-stage"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
  tl.fromTo(q(".s7-stage"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power1.in", immediateRender: false }, DUR - 0.4);

  // ---------- intro (0 - 6.9) ----------
  var introTitle = qa(".s7-i-title .s7-w");
  waterfall(introTitle, 5.2, 0.2, 90);
  waterfall(qa(".s7-i-sub .s7-w"), 3.6, 0.16, 44);
  pop(q('[data-k="ts"]'), 0.2, 30);
  pop(q('[data-k="sw"]'), 1.42, 30);
    pop(q('[data-k="eq"]'), 3.95, 10);
  tl.fromTo(q(".s7-i-title"), { textShadow: "0 0 0 rgba(16,185,129,0)" }, { textShadow: "0 0 50px rgba(16,185,129,0.55)", duration: 0.5, ease: "power2.out", immediateRender: false }, 5.4);
  tl.to(q(".s7-i-title"), { textShadow: "0 0 0 rgba(16,185,129,0)", duration: 0.8, ease: "power2.in" }, 6.2);
  // pips: waterfall at the "bảy luật" sentence, then fly to the top-right rail
  pips.forEach(function (pEl, i) {
    var dx = (960 + (i - 3) * 150) - (PIP_L + i * 70 + 28);
    var dy = I_CY - PIP_CY;
    tl.set(pEl, { x: dx, y: dy, scale: 2, opacity: 0 }, 0);
    tl.fromTo(pEl, { opacity: 0, y: dy + 45 }, { opacity: 1, y: dy, duration: 0.16, ease: "power4.out", immediateRender: false }, 5.5 + i * 0.12);
    tl.to(pEl, { x: 0, y: 0, scale: 1, duration: 0.75, ease: "power3.inOut" }, 6.8);
  });
  [".s7-i-title", ".s7-i-sub", ".s7-i-chips"].forEach(function (s) {
    tl.fromTo(q(s), { opacity: 1, y: 0 }, { opacity: 0, y: -36, duration: 0.4, ease: "power2.in", immediateRender: false }, 6.75);
  });
  tl.fromTo(q(".s7-head"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 7.05);

  // ---------- rule cards ----------
  RULES.forEach(function (R, ri) {
    var t0 = R.t0;
    // enter / previous exits
    tl.fromTo(R.el, { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, t0);
    if (ri > 0) tl.fromTo(RULES[ri - 1].el, { opacity: 1, x: 0 }, { opacity: 0, x: -110, duration: 0.3, ease: "power2.in", immediateRender: false }, t0 - 0.05);
    // title words waterfall + glow
    waterfall(R.words, R.tt, 0.12, 46);
    var tEl = q(".s7-title", R.el);
    tl.fromTo(tEl, { textShadow: "0 0 0 rgba(16,185,129,0)" }, { textShadow: "0 0 30px rgba(16,185,129,0.75)", duration: 0.3, ease: "power2.out", immediateRender: false }, R.tt + 0.02);
    tl.to(tEl, { textShadow: "0 0 0 rgba(16,185,129,0)", duration: 0.7, ease: "power2.in" }, R.tt + 0.9);
    tl.fromTo(q(".s7-num", R.el), { scale: 0.4 }, { scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, t0 + 0.1);
    // pip states
    tl.to(pips[ri], { backgroundColor: "rgba(16,185,129,1)", color: "#062A20", borderColor: "#10B981", duration: 0.3, ease: "power2.out" }, t0);
    if (ri > 0) tl.to(pips[ri - 1], { backgroundColor: "rgba(16,185,129,0.22)", color: "#6EE7B7", borderColor: "#10B981", duration: 0.3, ease: "power2.out" }, t0);
    // typing
    var prev = 0;
    R.type.forEach(function (seg) {
      var tgt = R.start[seg[2]] + (seg[3] != null ? seg[3] : R.len[seg[2]]);
      tl.fromTo(R.px, { n: prev }, { n: tgt, duration: seg[1] - seg[0], ease: "none", immediateRender: false, onUpdate: function () { renderRule(R, R.px.n); } }, seg[0]);
      prev = tgt;
    });
    // line highlight (spoken line bright, rest dim)
    var cur = R.lines.map(function () { return 1; });
    R.hl.forEach(function (h) {
      R.lnEls.forEach(function (ln, li) {
        var to = (h[1] < 0 || h[1] === li) ? 1 : 0.45;
        tl.fromTo(ln, { opacity: cur[li] }, { opacity: to, duration: 0.25, ease: "power1.out", immediateRender: false }, h[0]);
        cur[li] = to;
      });
    });
    // pops (art + chips)
    var chipTimes = {};
    (R.chips || []).forEach(function (c) { chipTimes[c.k] = c.t; });
    R.pops.forEach(function (pp) { pop(q('[data-k="' + pp[0] + '"]', R.el), pp[1]); });
    (R.chips || []).forEach(function (c) { pop(q('[data-k="' + c.k + '"]', R.el), c.t, 14); });
  });

  function renderRule(R, n) {
    R.lines.forEach(function (toks, li) {
      var rem = Math.max(0, Math.min(R.len[li], n - R.start[li])), used = 0, html = "";
      for (var k = 0; k < toks.length && used < rem; k++) {
        var take = toks[k][1].slice(0, rem - used);
        html += '<span class="s7-t s7-' + toks[k][0] + '">' + esc(take) + "</span>";
        used += take.length;
      }
      var typing = n < R.total && n >= R.start[li] && n <= R.start[li] + R.len[li];
      R.lnEls[li].innerHTML = html + (typing ? '<span class="s7-caret"></span>' : "");
    });
  }

  // rule 7: compile error
  var R7 = RULES[6];
  tl.fromTo(R7.errEl, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 81.4);
  tl.fromTo(R7.lnEls[3], { backgroundColor: "rgba(239,68,68,0)", borderLeftColor: "rgba(239,68,68,0)" }, { backgroundColor: "rgba(239,68,68,0.22)", borderLeftColor: "#EF4444", duration: 0.3, ease: "power2.out", immediateRender: false }, 81.4);

  // ---------- checklist: bắt đầu sau khi giọng đọc luật 7 xong (~84.9 s), dấu tích vẽ xong ~88 s, đứng yên đến hết ----------
  var T_CHK = 85.2;
  tl.fromTo(R7.el, { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.94, duration: 0.4, ease: "power2.in", immediateRender: false }, T_CHK);
  tl.to(pips[6], { backgroundColor: "rgba(16,185,129,0.22)", color: "#6EE7B7", borderColor: "#10B981", duration: 0.3, ease: "power2.out" }, T_CHK);
  rows.forEach(function (row, i) {
    var at = T_CHK + 0.35 + i * 0.09;
    tl.fromTo(row, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out", immediateRender: false }, at);
    var ck = q(".s7-ck", row), ct = T_CHK + 0.95 + i * 0.25;
    tl.fromTo(ck, { opacity: 0, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, ct);
  });
})();
      </script>
    </template>
  </body>
